<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ASIA LAB — Mobile Dashboard</title>
  <style>
    :root {
      /* Background & Base */
      --bg-primary: #7a9b8a;          /* Sage green */
      --bg-card: #f5f3f0;             /* Cream */
      --border-card: #e0d9d3;         /* Light border */

      /* Terracotta Color Ramp */
      --terracotta-light: #c4836f;    /* Sáng sớm 08:00-11:00 */
      --terracotta: #a85a4f;          /* Chiều 14:00-17:00 */
      --rust-dark: #8b4438;           /* Tối 18:00-21:00 */
      --urgent: #6b4a40;              /* Gấp < 2h */

      /* Text */
      --text-primary: #1a1a1a;        /* Black */
      --text-muted: #d0d0d0;          /* Light gray */
      --text-light: #e0e0e0;          /* Very light gray */

      /* Layout */
      --header-h: 56px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-size: 14px;
      -webkit-text-size-adjust: 100%;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* ═══════════════════════════════
       HEADER
    ═══════════════════════════════ */
    /* ═══════════════════════════════
       SEARCH BAR
    ═══════════════════════════════ */
    .search-bar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-card);
      height: var(--header-h);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 200;
    }

    .search-icon {
      font-size: 16px;
      flex-shrink: 0;
    }

    .search-bar input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      font-family: inherit;
      min-width: 0;
    }

    .search-bar input::placeholder {
      color: var(--text-muted);
      font-weight: 400;
    }

    .search-bar input::-webkit-search-cancel-button {
      display: none;
    }

    .search-clear {
      flex-shrink: 0;
      display: none;
      font-size: 16px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
    }

    .search-clear.visible {
      display: block;
    }

    .action-menu {
      position: relative;
      flex-shrink: 0;
    }

    .menu-trigger {
      width: 34px;
      height: 34px;
      border-radius: 7px;
      border: 1px solid var(--terracotta-light);
      background: transparent;
      color: var(--terracotta);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      font-family: inherit;
    }

    .menu-trigger:active {
      opacity: 0.75;
    }

    .menu-panel {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: min(240px, calc(100vw - 24px));
      padding: 6px;
      border-radius: 9px;
      border: 1px solid var(--border-card);
      background: rgba(255, 251, 248, 0.98);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.18);
      display: none;
      z-index: 260;
    }

    .action-menu.open .menu-panel {
      display: block;
    }

    .menu-item {
      width: 100%;
      min-height: 42px;
      padding: 9px 10px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
    }

    .menu-item:active {
      background: rgba(196, 131, 111, 0.12);
    }

    .menu-item.admin-only {
      display: none;
    }

    .menu-item.delay-only {
      display: none;
    }

    .menu-item.admin-visible {
      display: flex;
    }

    .menu-item.delay-visible {
      display: flex;
    }

    .menu-icon {
      width: 20px;
      text-align: center;
      flex-shrink: 0;
      color: var(--terracotta);
    }

    .feedback-alert-dot {
      display: none;
      width: 8px;
      height: 8px;
      margin-left: auto;
      border-radius: 50%;
      background: #e53935;
      box-shadow: 0 0 0 3px rgba(229, 57, 53, 0.16);
    }

    .feedback-alert-dot.show {
      display: inline-block;
    }

    .menu-item.danger {
      color: var(--terracotta);
    }

    .menu-item:disabled {
      opacity: 0.7;
      cursor: default;
    }

    .wip-panel {
      position: fixed;
      inset: 0;
      z-index: 230;
      display: none;
      flex-direction: column;
      background: var(--bg-primary);
      overflow: hidden;
    }

    .wip-panel.open {
      display: flex;
    }

    .wip-header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-card);
      background: rgba(255, 251, 248, 0.98);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
    }

    .wip-back {
      width: 36px;
      height: 36px;
      border: 1px solid var(--terracotta-light);
      border-radius: 7px;
      background: var(--bg-card);
      color: var(--terracotta);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .wip-title {
      flex: 1;
      min-width: 0;
    }

    .wip-title-main {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .wip-title-sub {
      margin-top: 2px;
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .wip-content {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      padding: 0;
      position: relative;
    }

    .wip-map-shell {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      background: #f7f2ee;
      overflow: hidden;
      touch-action: none;
    }

    #wipCanvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }

    #wipCanvas.dragging {
      cursor: grabbing;
    }

    .wip-kpi-bar {
      position: absolute;
      left: 8px;
      right: 8px;
      top: 8px;
      z-index: 4;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      pointer-events: none;
    }

    .wip-kpi {
      min-width: 0;
      padding: 6px 9px 7px;
      border: 1px solid rgba(196, 131, 111, 0.22);
      border-left: 4px solid #94a3b8;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 6px 14px rgba(88, 56, 43, 0.08);
    }

    .wip-kpi-label {
      font-size: 9px;
      font-weight: 800;
      color: #8a817b;
      line-height: 1.1;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .wip-kpi-value {
      margin-top: 2px;
      font-size: 16px;
      font-weight: 850;
      color: #2d2724;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .wip-kpi-meta {
      margin-top: 2px;
      font-size: 10px;
      font-weight: 600;
      color: #6b625d;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .wip-kpi.is-ok     { border-left-color: #16a34a; }
    .wip-kpi.is-warn   { border-left-color: #eab308; }
    .wip-kpi.is-alert  { border-left-color: #ea580c; }
    .wip-kpi.is-danger { border-left-color: #991b1b; }
    .wip-kpi.is-ok     .wip-kpi-value { color: #15803d; }
    .wip-kpi.is-danger .wip-kpi-value { color: #991b1b; }

    .wip-map-hud {
      position: absolute;
      left: 8px;
      right: 8px;
      top: 138px;
      z-index: 3;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      gap: 8px;
      pointer-events: none;
    }

    .wip-map-status {
      display: none;
    }

    .wip-map-tools {
      display: flex;
      justify-content: flex-end;
      gap: 5px;
      flex-wrap: wrap;
      pointer-events: auto;
    }

    .wip-map-btn {
      height: 28px;
      min-width: 30px;
      padding: 0 8px;
      border: 1px solid rgba(196, 131, 111, 0.24);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.94);
      color: var(--text-primary);
      font: inherit;
      font-size: 10px;
      font-weight: 800;
      box-shadow: 0 6px 14px rgba(88, 56, 43, 0.08);
      cursor: pointer;
    }

    .wip-map-btn.active {
      background: var(--terracotta);
      border-color: var(--terracotta);
      color: #fff;
    }

    .wip-map-legend {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 8px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      padding: 6px 8px;
      border: 1px solid rgba(196, 131, 111, 0.18);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.88);
      pointer-events: none;
      box-shadow: 0 8px 18px rgba(88, 56, 43, 0.07);
    }

    .wip-map-legend span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 9px;
      font-weight: 800;
    }

    .wip-map-legend i {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .wip-overview {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .wip-overview-item {
      border: 1px solid var(--border-card);
      border-radius: 8px;
      background: var(--bg-card);
      padding: 9px 8px;
      min-width: 0;
    }

    .wip-overview-item.alert {
      border-color: rgba(220, 38, 38, 0.28);
      background: rgba(220, 38, 38, 0.06);
    }

    .wip-overview-label {
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      line-height: 1.2;
    }

    .wip-overview-value {
      margin-top: 5px;
      color: var(--text-primary);
      font-size: 20px;
      font-weight: 850;
      line-height: 1;
    }

    .wip-overview-meta {
      margin-top: 4px;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 650;
      line-height: 1.2;
    }

    .wip-summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .wip-stage-card {
      border: 1px solid var(--border-card);
      border-left: 4px solid var(--terracotta);
      border-radius: 8px;
      background: var(--bg-card);
      padding: 9px;
      text-align: left;
      font: inherit;
      color: var(--text-primary);
      cursor: pointer;
    }

    .wip-stage-card.active {
      background: rgba(196, 131, 111, 0.13);
      border-color: var(--terracotta-light);
      box-shadow: inset 0 0 0 1px rgba(196, 131, 111, 0.2);
    }

    .wip-stage-name {
      font-size: 12px;
      font-weight: 800;
      line-height: 1.2;
    }

    .wip-stage-count {
      margin-top: 6px;
      font-size: 22px;
      font-weight: 800;
      color: var(--terracotta);
      line-height: 1;
    }

    .wip-stage-meta {
      margin-top: 4px;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.25;
    }

    .wip-list-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 800;
    }

    .wip-list-meta {
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .wip-order-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .wip-order-card {
      border: 1px solid var(--border-card);
      border-left: 4px solid var(--terracotta);
      border-radius: 8px;
      background: var(--bg-card);
      padding: 9px;
      cursor: pointer;
    }

    .wip-order-top,
    .wip-order-mid,
    .wip-order-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .wip-order-code {
      color: var(--terracotta);
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
    }

    .wip-order-customer {
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 700;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .wip-order-patient {
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 600;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .wip-order-qty,
    .wip-order-stage,
    .wip-order-deadline {
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .wip-order-ph {
      margin-top: 5px;
      color: var(--terracotta);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.25;
    }

    .wip-stage-buckets {
      margin-top: 7px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 3px;
    }
    .wip-stage-buckets .bk {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3px 2px;
      border-radius: 4px;
      background: rgba(148, 163, 184, 0.10);
      line-height: 1.05;
    }
    .wip-stage-buckets .bk-lbl {
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.02em;
      opacity: 0.75;
    }
    .wip-stage-buckets .bk-num {
      margin-top: 1px;
      font-size: 12px;
      font-weight: 800;
    }
    .wip-stage-buckets .bk.is-zero { opacity: 0.35; }
    .wip-stage-buckets .bk-lt2 { color: #64748b; }
    .wip-stage-buckets .bk-lt8 { color: #475569; }
    .wip-stage-buckets .bk-lt24 {
      color: #ea580c;
      background: rgba(234, 88, 12, 0.13);
    }
    .wip-stage-buckets .bk-gt24 {
      color: #dc2626;
      background: rgba(220, 38, 38, 0.16);
    }
    .wip-stage-buckets .bk-lt24.is-zero,
    .wip-stage-buckets .bk-gt24.is-zero {
      background: rgba(148, 163, 184, 0.10);
    }

    .wip-order-age-warn { color: #ea580c; font-weight: 700; }
    .wip-order-age-danger { color: #dc2626; font-weight: 800; }

    .wip-ktv-summary {
      margin: 4px 0 10px;
      padding: 9px 10px;
      border: 1px solid var(--border-card);
      border-radius: 8px;
      background: rgba(196, 131, 111, 0.05);
    }
    .wip-ktv-summary-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .wip-ktv-chips-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .wip-ktv-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border: 1px solid var(--border-card);
      border-radius: 12px;
      background: var(--bg-card);
      font: inherit;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      line-height: 1.2;
    }
    .wip-ktv-chip.active {
      background: var(--terracotta);
      color: #fff;
      border-color: var(--terracotta);
    }
    .wip-ktv-chip .ktv-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 16px;
      padding: 0 5px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 800;
      background: rgba(196, 131, 111, 0.15);
      color: var(--terracotta);
    }
    .wip-ktv-chip.active .ktv-count {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
    }
    .wip-ktv-chip.wip-ktv-unclaimed {
      border-color: rgba(220, 38, 38, 0.35);
    }
    .wip-ktv-chip.wip-ktv-unclaimed .ktv-count {
      background: rgba(220, 38, 38, 0.15);
      color: #dc2626;
    }
    .wip-ktv-chip.wip-ktv-unclaimed.active {
      background: #dc2626;
      border-color: #dc2626;
    }
    .wip-ktv-chip.wip-ktv-clear {
      border-style: dashed;
      color: var(--text-muted);
    }

    /* ═══════════════════════════════
       FILTER BAR
    ═══════════════════════════════ */
    .filter-bar {
      position: sticky;
      top: var(--header-h);
      z-index: 150;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-card);
      padding: 8px 10px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .fchip {
      flex-shrink: 0;
      padding: 5px 13px;
      border-radius: 16px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border-card);
      color: #666;
      background: transparent;
      transition: all .15s;
      white-space: nowrap;
      font-family: inherit;
    }
    .fchip.active { background: var(--terracotta); border-color: var(--terracotta); color: #fff; }

    .filter-summary {
      position: sticky;
      top: calc(var(--header-h) + 43px);
      z-index: 145;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 7px 10px 8px;
      background: rgba(255, 251, 248, 0.96);
      border-bottom: 1px solid var(--border-card);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
    }
    .filter-summary::-webkit-scrollbar { display: none; }
    .delay-banner {
      display: none;
      margin: 8px 10px 0;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(185, 28, 28, 0.24);
      background: #fff1f0;
      color: #8a231d;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
    }
    .delay-banner.show { display: block; }
    .summary-pill {
      flex: 0 0 auto;
      min-width: 92px;
      padding: 6px 9px;
      border: 1px solid rgba(196, 131, 111, 0.26);
      border-radius: 7px;
      background: #fff;
      color: var(--text-primary);
    }
    .summary-date {
      font-size: 11px;
      font-weight: 700;
      color: var(--terracotta);
      line-height: 1.2;
      white-space: nowrap;
    }
    .summary-count {
      margin-top: 3px;
      font-size: 10px;
      color: var(--text-muted);
      line-height: 1.25;
      white-space: nowrap;
    }
    .summary-empty {
      padding: 6px 2px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .summary-pill { cursor: pointer; }
    .summary-pill:active { opacity: 0.7; }

    #dayModalOverlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 997;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      display: flex !important;
      align-items: flex-end;
      justify-content: center;
    }
    #dayModalOverlay.open { opacity: 1; pointer-events: auto; }
    #dayModalContent {
      width: 100%;
      max-width: 480px;
      max-height: 75vh;
      border-radius: 12px 12px 0 0;
      overflow: hidden;
    }
    .day-order-row {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 12px 11px 14px;
      margin-bottom: 9px;
      border: 1px solid rgba(196, 131, 111, 0.18);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.96) 0%, rgba(253, 248, 245, 0.96) 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.95),
        0 9px 18px rgba(88, 56, 43, 0.11),
        0 2px 5px rgba(88, 56, 43, 0.08);
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
      overflow: hidden;
    }
    .day-order-row::before {
      content: "";
      position: absolute;
      left: 0;

  <script>
    const STAGE_NAMES = ['CBM', 'SÁP/Cadcam', 'SƯỜN', 'ĐẮP', 'MÀI'];
    const STAGE_COLORS = {
      'CBM': '#3b82f6',
      'SÁP/Cadcam': '#a855f7',
      'SƯỜN': '#f59e0b',
      'ĐẮP': '#f97316',
      'MÀI': '#10b981'
    };

    const STAGE_SHORT = {
      'CBM': 'CBM',
      'SÁP/Cadcam': 'SÁP',
      'SƯỜN': 'SƯỜN',
      'ĐẮP': 'ĐẮP',
      'MÀI': 'MÀI',
      'HOÀN TẤT': '✓'
    };

    const ROOM_COLORS = { sap: '#f59e0b', zirco: '#2563eb', both: '#0891b2', none: '#9ca3af' };
    function roomColor(room) {
      return ROOM_COLORS[room] || ROOM_COLORS.sap;
    }

    function getCurrentStageFromStages(stages) {
      const list = stages || [];
      const latestDoneIndex = list.reduce((latest, stage, index) => (
        !stage.sk && stage.x ? Math.max(latest, index) : latest
      ), -1);
      const current = list.find((stage, index) => !stage.sk && !stage.x && index > latestDoneIndex);
      return current?.n || 'HOÀN TẤT';
    }

    function normalizeKeylabSxInfo(info) {
      if (!info) return {};
      if (typeof info === 'string') {
        try { return JSON.parse(info) || {}; } catch { return {}; }
      }
      return typeof info === 'object' ? info : {};
    }

    function adaptOrder(o) {
      const current_stage = o.current_stage || getCurrentStageFromStages(o.stages || []);
      const urgent = o.yc_ht
        ? ((parseDeadline(o.yc_ht) || 0) - Date.now()) < 2 * 3600 * 1000
        : false;
      return {
        ma_dh:         o.ma_dh,
        benh_nhan:     o.bn || '',
        khach_hang:    o.kh || '',
        phuc_hinh:     o.ph || '',
        sl:            o.sl || 0,
        ghi_chu:       o.gc || '',
        current_stage,
        yc_ht:         o.yc_ht || '',
        yc_giao:       o.yc_giao || '',
        nhan:          o.nhan || '',
        loai_lenh:     o.lk || '',
        ghi_chu_sx:    o.ghi_chu_sx || '',
        keylab_sx_info: normalizeKeylabSxInfo(o.keylab_sx_info),
        routed_to:     o.routed_to || 'sap',
        active_thu_suon: !!o.active_thu_suon,
        clinic_tags:   Array.isArray(o.clinic_tags) ? o.clinic_tags : [],
        urgent,
        stagesData:    o.stages || [],
      };
    }

    function normalizePhText(value) {
      // \u0111/\u0110 l\u00e0 codepoint nguy\u00ean t\u1eed, NFD kh\u00f4ng t\u00e1ch \u2192 c\u1ea7n thay ri\u00eang \u0111\u1ec3 search kh\u00f4ng d\u1ea5u kh\u1edbp \u0111\u01b0\u1ee3c
      return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\u0111/g, 'd');
    }

    // === Note KTV parser cho S\u1eeda/L\u00e0m th\u00eam/L\u00e0m l\u1ea1i/B\u1ea3o h\u00e0nh ===
    // Map alias kh\u00f4ng d\u1ea5u \u2192 c\u00f4ng \u0111o\u1ea1n theo cong_doan c\u1ee7a user trong users.json.
    // L\u00e2n l\u00e0 admin (m\u00e0i). T\u00ean ngo\u00e0i map (\u0110\u1ea1t, Tr\u00ed, Sang, An, ...) \u0111\u01b0\u1ee3c b\u1ecf qua theo y\u00eau c\u1ea7u.
    const NOTE_KTV_MAP = {
      'lan':    { stage: 'M\u00c0I',        name: 'L\u00e2n' },     // admin
      'tuan':   { stage: 'M\u00c0I',        name: 'Tu\u1ea5n' },    // minhtuan
      'hy':     { stage: 'M\u00c0I',        name: 'H\u1ef7' },      // thehy
      'tran':   { stage: 'M\u00c0I',        name: 'Tr\u00e2n' },    // baotran
      'thu':    { stage: 'M\u00c0I',        name: 'Th\u01b0' },     // giathu
      'huu':    { stage: 'M\u00c0I',        name: 'H\u1eefu' },     // tanhuu
      'my':     { stage: '\u0110\u1eaeP',        name: 'My' },      // trucmy
      'truong': { stage: '\u0110\u1eaeP',        name: 'Tr\u01b0\u1eddng' },  // vutruong
      'hong':   { stage: '\u0110\u1eaeP',        name: 'H\u1ed3ng' },    // camhong
      'trang':  { stage: '\u0110\u1eaeP',        name: 'Trang' },   // hoaitrang
      'vy':     { stage: '\u0110\u1eaeP',        name: 'Vy' },      // yenvy
      'truc':   { stage: '\u0110\u1eaeP',        name: 'Tr\u1ef1c' },    // trungtruc
      'si':     { stage: 'S\u01af\u1edcN',       name: 'S\u0129' },      // tansi
      'trai':   { stage: 'S\u01af\u1edcN',       name: 'Tr\u1ea3i' },    // vantrai
      'tham':   { stage: 'S\u00c1P/Cadcam', name: 'Th\u1eafm' },    // hongtham
      'hanh':   { stage: 'S\u00c1P/Cadcam', name: 'H\u1ea1nh' },    // thihanh
      'son':    { stage: 'S\u00c1P/Cadcam', name: 'S\u01a1n' },     // thaison
      'huyen':  { stage: 'S\u00c1P/Cadcam', name: 'Huy\u1ebfn' },   // vanhuyen
      'van':    { stage: 'CBM',        name: 'V\u1ea1n' },     // vanvan
      'toan':   { stage: 'CBM',        name: 'To\u00e0n' },    // chitoan
    };
    const NOTE_STAGE_ORDER = { 'CBM': 0, 'S\u00c1P/Cadcam': 1, 'S\u01af\u1edcN': 2, '\u0110\u1eaeP': 3, 'M\u00c0I': 4 };
    const NOTE_STOP_WORDS = new Set([
      'sua','lam','lai','them','tiep','bao','hanh','ko','khong','ten','gui','cua','da','hen','va','hoac','cach','toi','hom','nay','mai'
    ]);
    function isNoteStopToken(tok) {
      if (!tok || tok.length <= 1) return true;
      if (NOTE_STOP_WORDS.has(tok)) return true;
      if (/^x\d+$/.test(tok)) return true;
      if (/^\d+$/.test(tok)) return true;
      // token to\u00e0n ph\u1ee5 \u00e2m (kh\u00f4ng c\u00f3 a/e/i/o/u, y v\u1eabn gi\u1eef): llht, bhht, ts, gk, nk, ...
      if (/^[bcdfghjklmnpqrstvwxz]{2,5}$/.test(tok)) return true;
      return false;
    }
    function parseNoteKtvs(ghiChu, loaiLenh) {
      if (!ghiChu) return [];
      const lkN = String(loaiLenh || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[\u0111\u0110]/g, 'd').toLowerCase().trim();
      if (!(lkN.includes('sua') || lkN.includes('lam them') || lkN.includes('lam lai') || lkN.includes('bao hanh'))) return [];
      const text = String(ghiChu)
        .replace(/_x[0-9a-fA-F]{4}_/g, ' ') // g\u1ee1 escape Excel _x000d_ / _x000a_
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[\u0111\u0110]/g, 'd').toLowerCase()
        .replace(/x\d+/g, ' ');
      const tokens = text.split(/[\s\-\u2014\u2013/,()+.;:\r\n_]+/).filter(Boolean);
      const seen = new Set();
      const found = [];
      for (const tok of tokens) {
        if (isNoteStopToken(tok)) continue;
        const m = NOTE_KTV_MAP[tok];
        if (!m || seen.has(m.name)) continue;
        seen.add(m.name);
        found.push(m);
      }
      found.sort((a, b) => (NOTE_STAGE_ORDER[a.stage] ?? 99) - (NOTE_STAGE_ORDER[b.stage] ?? 99));
      return found;
    }
    function splitPhParts(ph) {
      return String(ph || '').split(/;|\r?\n/).map(part => part.trim()).filter(Boolean);
    }
    function partQty(part) {
      const m = String(part || '').match(/SL\s*:\s*(\d+)/i);
      return m ? Number(m[1]) || 0 : 0;
    }
    function hasInMauHamText(text) {
      const n = normalizePhText(text);
      return (
        n.includes('in mau ham') ||
        (n.includes('in mau') && n.includes('ham')) ||
        (n.includes('in ban') && n.includes('ham')) ||
        (n.includes('in toan') && n.includes('ham'))
      );
    }
    function orderHasInMauHam(o) {
      return hasInMauHamText(o?.phuc_hinh) || hasInMauHamText(o?.ghi_chu_sx);
    }
    function partType(part) {
      const p = (part || '').toLowerCase();
      const n = normalizePhText(part);
      const isZirconiaMaterial =
        p.includes('zircornia') || p.includes('zirconia') || p.includes('ziconia') ||
        p.includes('zir-') || p.includes('zolid') || p.includes('cercon') ||
        p.includes('la va') || p.includes('full zirconia') || n.includes('argen');
      const isMetalMaterial =
        n.includes('kim loai') || p.includes('titanium') || n.includes('titan') ||
        p.includes('chrome') || p.includes('cobalt');
      const isTemporaryMaterial =
        n.includes('rang tam') || p.includes('pmma') || n.includes('in resin');

      if (hasInMauHamText(part) || n.includes('in mau') || n.includes('mau ham')) return 'inmau';
      if (isTemporaryMaterial) return 'tam';
      if (p.includes('cùi giả zirconia') || n.includes('cui gia zirconia')) return 'hon';
      if (p.includes('veneer')) {
        if (isZirconiaMaterial) return 'zirc';
        if (isMetalMaterial) return 'kl';
        return 'vnr';
      }
      if (p.includes('mặt dán') || n.includes('mat dan')) return 'vnr';
      if (isZirconiaMaterial) return 'zirc';
      return 'kl';
    }
    function phBreakdown(ph, totalQty) {
      const qty = { zirc: 0, kl: 0, vnr: 0, hon: 0, inmau: 0, tam: 0 };
      const parts = splitPhParts(ph);
      let assigned = 0;
      parts.forEach(part => {
        const q = partQty(part);
        if (!q) return;
        const type = partType(part);
        qty[type] += q;
        assigned += q;
      });
      if (!assigned) qty[partType(ph)] += Number(totalQty) || 0;
      return qty;
    }
    function phMatches(o, filter) {
      if (filter === 'all') return true;
      if (filter === 'inmau' && orderHasInMauHam(o)) return true;
      return (phBreakdown(o.phuc_hinh, o.sl)[filter] || 0) > 0;
    }
    function filterQty(o, filter) {
      if (filter === 'all') return Number(o.sl) || 0;
      const qty = phBreakdown(o.phuc_hinh, o.sl)[filter] || 0;
      if (filter === 'inmau' && !qty && orderHasInMauHam(o)) return Number(o.sl) || 0;
      return qty;
    }
    function filterLabel(filter) {
      return {
        zirc: 'Zirconia',
        kl: 'Kim loại',
        vnr: 'Mặt dán',
        hon: 'Hỗn hợp',
        inmau: 'In mẫu',
        tam: 'Răng tạm',
      }[filter] || 'Tổng';
    }
    function displayQty(o) {
      const qty = filterQty(o, filterPh);
      return {
        qty,
        label: filterPh === 'all' ? 'SL' : `SL ${filterLabel(filterPh)}`,
        total: Number(o.sl) || 0,
      };
    }
    function phType(ph) {
      const qty = phBreakdown(ph, 0);
      if (qty.hon) return 'hon';
      if (qty.vnr) return 'vnr';
      if (qty.zirc) return 'zirc';
      if (qty.kl) return 'kl';
      if (qty.tam) return 'tam';
      if (qty.inmau) return 'inmau';
      return partType(ph);
    }
    function phShort(ph) {
      if (!ph) return 'SỨ';
      if (ph.includes('Zircornia') || ph.includes('Ziconia') || ph.includes('Zirconia') || ph.includes('Zolid')) return 'ZIRC';
      if (ph.includes('Diamond') || ph.includes('Zir-')) return 'ZIR-D';
      if (ph.includes('Cercon')) return 'CERCON';
      if (ph.includes('Argen')) return 'ARGEN';
      if (ph.includes('Titanium') || ph.includes('Titan')) return 'TITAN';
      if (ph.toLowerCase().includes('cùi giả zirconia')) return 'HON HỢP';
      if (ph.includes('Veneer') || ph.includes('Mặt dán')) return 'VENEER';
      if (ph.includes('Chrome')) return 'Cr-Co';
      if (ph.includes('Cùi')) return 'CÙI';
      if (ph.includes('La Va')) return 'LA VA';
      if (phType(ph) === 'tam') return 'RĂNG TẠM';
      if (phType(ph) === 'inmau') return 'IN MẪU';
      return 'KL';
    }

    function getCompletionTimeGroup(yc_ht) {
      if (!yc_ht) return 'default';
      const timePart = yc_ht.split(' ')[1];
      if (!timePart) return 'default';
      const hour = parseInt(timePart.split(':')[0]);
      if (hour >= 8 && hour < 11) return 'morning';
      if (hour >= 11 && hour < 14) return 'noon';
      if (hour >= 14 && hour < 18) return 'afternoon';
      if (hour >= 18 && hour <= 23) return 'evening';
      return 'default';
    }

    function formatTime(dateStr) {
      if (!dateStr) return '—';
      const [date, time] = dateStr.split(' ');
      return time ? time.substring(0, 5) : '—';
    }

    function formatDate(dateStr) {
      if (!dateStr) return '—';
      const [date] = dateStr.split(' ');
      return date;
    }

    function formatStageDoneTime(dateStr) {
      if (!dateStr) return '---';
      const parts = String(dateStr).trim().split(/\s+/);
      const date = parts[0] || '';
      const time = parts[1] || '';
      const hm = time ? time.substring(0, 5) : '';

      if (date.includes('/')) {
        const d = date.split('/');
        const dayMonth = d.length >= 2 ? `${d[0]}/${d[1]}` : date;
        return hm ? `${dayMonth} ${hm}` : dayMonth;
      }

      if (date.includes('-')) {
        const d = date.split('-');
        const dayMonth = d.length >= 3 ? `${d[2]}/${d[1]}` : date;
        return hm ? `${dayMonth} ${hm}` : dayMonth;
      }

      return hm || date || '---';
    }

    function getFiltered() {
      let list = allOrders;
      if (filterPh !== 'all') list = list.filter(o => phMatches(o, filterPh));
      if (!filterSearch) return list;
      const q = normalizePhText(filterSearch).trim();
      return list.filter(o =>
        normalizePhText(o.ma_dh).includes(q) ||
        normalizePhText(o.benh_nhan).includes(q) ||
        normalizePhText(o.khach_hang).includes(q) ||
        normalizePhText(o.phuc_hinh).includes(q) ||
        normalizePhText(o.ghi_chu).includes(q) ||
        normalizePhText(o.ghi_chu_sx).includes(q) ||
        normalizePhText(o.current_stage).includes(q) ||
        normalizePhText(o.loai_lenh).includes(q) ||
        normalizePhText(o.yc_giao).includes(q)
      );
    }

    function getChipFiltered() {
      if (filterPh === 'all') return allOrders;
      return allOrders.filter(o => phMatches(o, filterPh));
    }

    function parseYcHtDay(ycHt) {
      if (!ycHt) return null;
      const raw = String(ycHt).trim();
      if (!raw) return null;
      const date = raw.split(/\s+/)[0];

      if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(date)) {
        const [yyyy, mm, dd] = date.split('-');
        return {
          key: `${yyyy}-${mm.padStart(2, '0')}-${dd.padStart(2, '0')}`,
          label: `${dd.padStart(2, '0')}/${mm.padStart(2, '0')}`,
        };
      }

      if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(date)) {
        const [dd, mm, yyyy] = date.split('/');
        return {
          key: `${yyyy}-${mm.padStart(2, '0')}-${dd.padStart(2, '0')}`,
          label: `${dd.padStart(2, '0')}/${mm.padStart(2, '0')}`,
        };
      }

      return { key: date, label: date.slice(0, 5) };
    }

    function renderFilterSummary(orders) {
      const el = document.getElementById('filterSummary');
      if (!el) return;
      if (!currentUser) return;
      if (!canViewFilterSummary()) {
        lastFilterSummaryFingerprint = 'hidden';
        el.innerHTML = '';
        el.style.display = 'none';
        return;
      }

      const byDay = new Map();
      orders.forEach(o => {
        const day = parseYcHtDay(o.yc_ht);
        if (!day) return;
        if (!byDay.has(day.key)) {
          byDay.set(day.key, { label: day.label, orders: 0, qty: 0 });
        }
        const row = byDay.get(day.key);
        row.orders += 1;
        row.qty += filterQty(o, filterPh);
      });

      const rows = Array.from(byDay.entries()).sort(([a], [b]) => a.localeCompare(b));
      const fingerprint = rows.map(([key, r]) => `${key}:${r.orders}:${r.qty}`).join('|') || 'empty';
      if (fingerprint === lastFilterSummaryFingerprint && el.style.display === 'flex') return;
      lastFilterSummaryFingerprint = fingerprint;
      el.style.display = 'flex';

      if (!rows.length) {
        el.innerHTML = '<div class="summary-empty">Chưa có ngày hoàn thành</div>';
        return;
      }

      el.innerHTML = rows.map(([key, r]) => `
        <div class="summary-pill" onclick="openDayModal('${key}','${r.label}')" role="button">
          <div class="summary-date">${r.label}</div>
          <div class="summary-count">${r.orders} đơn · ${r.qty} răng</div>
        </div>
      `).join('');
    }

    function toggleActionMenu(event) {
      if (event) event.stopPropagation();
      const menu = document.getElementById('actionMenu');
      const trigger = document.getElementById('menuTrigger');
      if (!menu) return;
      const isOpen = menu.classList.toggle('open');
      if (trigger) trigger.setAttribute('aria-expanded', String(isOpen));
    }

    function closeActionMenu() {
      const menu = document.getElementById('actionMenu');
      const trigger = document.getElementById('menuTrigger');
      if (!menu) return;
      menu.classList.remove('open');
      if (trigger) trigger.setAttribute('aria-expanded', 'false');

    function canViewWipPanel() {
      return hasPerm('stats.view_wip');
    }

    function htmlSafe(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      }[ch]));
    }

    function cleanDisplayText(value) {
      return String(value ?? '')
        .replace(/_x000d_\s*/gi, '\n')
        .replace(/\\x000d|\\x00d|\\u000d|x000d|x00d/gi, '\n')
        .replace(/\r\n?/g, '\n')
        .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, ' ')
        .replace(/[ \t]+\n/g, '\n')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
    }

    function displayHtml(value) {
      return htmlSafe(cleanDisplayText(value)).replace(/\n/g, '<br>');
    }

    function listFromKeylab(value) {
      return Array.isArray(value) ? value.filter(Boolean) : [];
    }

    const KEYLAB_PRODUCTION_LABELS = {
      sap_can: 'Sáp cắn',
      gia_khop: 'Giá khớp',
      khay_lay_dau: 'Khay lấy dấu',
      so_khay_lay_dau: 'Khay lấy dấu',
      ham_doi: 'Hàm đối',
      tren_nuou: 'Trên nướu',
      ngang_nuou: 'Ngang nướu',
      duoi_nuou: 'Dưới nướu',
      bo_vai: 'Bờ vai',
      khac: 'Khác',
      phu_kien: 'Phụ kiện',
      gui_labo_ngoai: 'Gửi labo ngoài',
      chi_dinh: 'Chỉ định',
      noi_dung_khac: 'Nội dung khác',
      trao_doi_bac_si: 'Trao đổi bác sĩ',
    };

    function productionLabel(label) {
      return KEYLAB_PRODUCTION_LABELS[label] || label || '';
    }

    function productionValue(value) {
      return String(value || '').trim().toLowerCase() === 'co' ? 'Có' : value;
    }

    function hasProductionInfo(order) {
      const info = normalizeKeylabSxInfo(order?.keylab_sx_info);
      return !!(
        cleanDisplayText(order?.ghi_chu_sx) ||
        listFromKeylab(info.colors).length ||
        listFromKeylab(info.attributes).length ||
        listFromKeylab(info.instructions).length ||
        (Array.isArray(order?.clinic_tags) && order.clinic_tags.length) ||
        (order?.khach_hang && canEditClinicTags())
      );
    }

    function renderProductionChips(items) {
      const list = listFromKeylab(items);
      const trayCountItem = list.find(item => item?.label === 'so_khay_lay_dau' && cleanDisplayText(item?.value));
      const hasTrayFlag = list.some(item => item?.label === 'khay_lay_dau' && cleanDisplayText(item?.value));
      return list.map(item => {
        const label = item?.label || '';
        const value = item?.value || '';
        if (!value) return '';
        if (label === 'so_khay_lay_dau' && hasTrayFlag) return '';
        const shownValue = productionValue(value);
        const labelText = productionLabel(label);
        const trayCount = label === 'khay_lay_dau' ? cleanDisplayText(trayCountItem?.value) : '';
        const text = String(value).trim().toLowerCase() === 'co'
          ? (trayCount ? `${labelText}: ${trayCount}` : labelText)
          : `${labelText}: ${shownValue}`;
        return `<span class="production-chip">${displayHtml(text)}</span>`;
      }).join('');
    }

    function renderProductionPreview(id, title, text, maxChars = 120, alwaysHide = false) {
      const value = cleanDisplayText(text);
      if (!value) return '';
      if (alwaysHide) {
        return `<div>
          <div class="production-subtitle">${htmlSafe(title)}</div>
          <div id="${htmlSafe(id)}" class="production-preview" style="display:none;">${displayHtml(value)}</div>
          <button type="button" class="production-more" onclick="toggleProductionHidden('${htmlSafe(id)}', this)">Xem thêm</button>
        </div>`;
      }
      const collapsed = value.length > maxChars || value.includes('\n');
      return `<div>
        <div class="production-subtitle">${htmlSafe(title)}</div>
        <div id="${htmlSafe(id)}" class="production-preview${collapsed ? ' collapsed' : ''}">${displayHtml(value)}</div>
        ${collapsed ? `<button type="button" class="production-more" onclick="toggleProductionPreview('${htmlSafe(id)}', this)">Xem thêm</button>` : ''}
      </div>`;
    }

    function toggleProductionPreview(id, button) {
      const el = document.getElementById(id);
      if (!el) return;
      const collapsed = el.classList.toggle('collapsed');
      if (button) button.textContent = collapsed ? 'Xem thêm' : 'Thu gọn';
    }

    function toggleProductionHidden(id, button) {
      const el = document.getElementById(id);
      if (!el) return;
      const isHidden = el.style.display === 'none';
      el.style.display = isHidden ? 'block' : 'none';
      if (button) button.textContent = isHidden ? 'Thu gọn' : 'Xem thêm';
    }

    function canEditClinicTags() {
      if (!currentUser) return false;
      if (currentUser.role === 'admin') return true;
      return (currentUser.permissions || []).includes('clinic_notes.edit');
    }

    async function promptAddClinicTag(khach_hang, ma_dh, btn) {
      const label = (prompt(`Thêm chip cho "${khach_hang}":`) || '').trim();
      if (!label) return;
      if (label.length > 60) { showToast('Tối đa 60 ký tự', 'warn'); return; }
      try {
        const r = await fetch('/admin/api/clinic-tags', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ khach_hang, label }),
        });
        const data = await r.json();
        if (!r.ok) {
          showToast(data.error === 'duplicate' ? 'Chip đã tồn tại' : (data.error || 'Lỗi thêm chip'), 'warn');
          return;
        }
        const chip = document.createElement('span');
        chip.className = 'production-chip';
        chip.textContent = label;
        btn.parentNode.insertBefore(chip, btn);
        allOrders.filter(o => o.khach_hang === khach_hang).forEach(o => {
          if (!Array.isArray(o.clinic_tags)) o.clinic_tags = [];
          if (!o.clinic_tags.includes(label)) o.clinic_tags.push(label);
        });
        showToast('Đã thêm chip');
      } catch { showToast('Lỗi mạng', 'warn'); }
    }

    function renderInlineProductionInfo(order) {
      if (!order || !hasProductionInfo(order)) return '';
      const info = normalizeKeylabSxInfo(order.keylab_sx_info);
      const colors = listFromKeylab(info.colors);
      const attrChips = renderProductionChips(info.attributes);
      const instructionText = listFromKeylab(info.instructions)

      const canEdit = order.khach_hang && canEditClinicTags();

        ${colors.length ? `<div class="production-subtitle">Màu sắc</div><div class="production-chip-list">${colors.map(c => `<span class="production-chip">${htmlSafe(c)}</span>`).join('')}</div>` : ''}
        ${attrChips ? `<div class="production-subtitle">Phụ kiện đi kèm</div><div class="production-chip-list">${attrChips}</div>` : ''}
        ${renderProductionPreview(`${idPrefix}-note`, 'Ghi chú sản xuất', note, 140)}
        ${renderProductionPreview(`${idPrefix}-inst`, 'Lưu ý chung nha khoa', instructionText, 120, true)}

    function normalizeWipOrder(o) {
      return {
        ...o,
        ma_dh:      o.ma_dh || '',
        benh_nhan:  o.benh_nhan || '',
        khach_hang: o.khach_hang || '',
        phuc_hinh:  o.phuc_hinh || '',
        sl:         Number(o.sl) || 0,
        yc_ht:      o.yc_ht || '',
        yc_giao:    o.yc_giao || '',
        nhan:       o.nhan || '',
        current_stage: o.current_stage || 'HOÀN TẤT',
        current_stage_started_at: typeof o.current_stage_started_at === 'number' ? o.current_stage_started_at : null,
        current_stage_age_minutes: typeof o.current_stage_age_minutes === 'number' ? o.current_stage_age_minutes : null,
        stagesData: Array.isArray(o.stagesData) ? o.stagesData : [],
      };
    }

    function wipStageAgeMinutes(o) {
      if (!o || o.current_stage === 'HOÀN TẤT') return null;
      if (typeof o.current_stage_started_at === 'number' && o.current_stage_started_at > 0) {
        return Math.max(0, Math.floor((Date.now() - o.current_stage_started_at) / 60000));
      }
      return typeof o.current_stage_age_minutes === 'number' ? o.current_stage_age_minutes : null;
    }

    function wipAgeBucket(o) {
      const m = wipStageAgeMinutes(o);
      if (m == null) return null;
      if (m < 120) return 'lt2';
      if (m < 480) return 'lt8';
      if (m < 1440) return 'lt24';
      return 'gt24';
    }

    function wipBucketCounts(orders) {
      const counts = { lt2: 0, lt8: 0, lt24: 0, gt24: 0 };
      for (const o of orders || []) {
        const b = wipAgeBucket(o);
        if (b) counts[b] += 1;
      }
      return counts;
    }

    function formatAgeShort(minutes) {
      if (minutes == null) return '';
      if (minutes < 60) return `${minutes}p`;
      const hours = minutes / 60;
      if (hours < 48) return `${Math.floor(hours)}h`;
      return `${Math.floor(hours / 24)}n`;
    }

    function isPlaceholderKtv(name) {
      if (!name) return true;
      if (/^[-—–_.\s]+$/.test(name)) return true;
      if (/^(n\/a|na|none|null|unknown|chua nhan|chưa nhận)$/i.test(name)) return true;
      return false;
    }

    function ktvForOrder(o) {
      if (!o) return null;
      const stages = o.stagesData || [];
      if (o.current_stage === 'HOÀN TẤT') {
        for (let i = stages.length - 1; i >= 0; i--) {
          const s = stages[i];
          if (!s.sk && s.k) return s.k;
        }
        return null;
      }
      const current = stages.find(s => !s.sk && s.n === o.current_stage);
      return current && current.k ? current.k : null;
    }

    function buildKtvBreakdown(orders) {
      const map = new Map();
      let unclaimed = 0;
      for (const o of orders || []) {
        const k = ktvForOrder(o);
        if (k == null) unclaimed++;
        else map.set(k, (map.get(k) || 0) + 1);
      }
      const entries = [...map.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'vi'));
      return { entries, unclaimed };
    }

    function filterWipByKtv(name) {
      wipSelectedKtv = wipSelectedKtv === name ? null : name;
      renderWipPanel(wipSelectedStage, false);
    }

    function computeOrdersFingerprint(orders) {
      return (orders || [])
        .map(o => [
          o.ma_dh, o.current_stage, o.sl, o.yc_ht, o.yc_giao, o.routed_to,
          o.urgent ? '1' : '0', o.delay_report ? '1' : '0',
          (o.stagesData || []).map(s => (s.x ? '1' : '0') + (s.sk ? 's' : '') + (s.k || '')).join(',')
        ].join('|'))
        .sort()
        .join(';;');
    }

    function computeWipFingerprint(data) {
      if (!data) return '';
      const ser = arr => (arr || []).map(o => [
        o.ma_dh, o.current_stage, o.current_stage_started_at || 0,
        (o.stagesData || []).map(s => (s.x ? '1' : '0') + (s.k || '')).join(',')
      ].join('|')).sort().join(';;');
      return ser(data.received?.orders) + '##' + ser(data.carryover?.orders);
    }

    function isInteractionBlocking() {
      const modal = document.getElementById('modalOverlay');
      if (modal && modal.classList.contains('open')) return true;
      const menu = document.getElementById('actionMenu');
      if (menu && menu.classList.contains('open')) return true;
      if (typeof transferScannerActive !== 'undefined' && transferScannerActive) return true;
      return false;
    }

    async function loadWipStats() {
      const res = await fetch('/api/stats/wip?t=' + Date.now());
      if (!res.ok) throw new Error('Không tải được WIP');
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Không tải được WIP');
      data.received = data.received || {};
      data.carryover = data.carryover || {};
      data.received.orders = (data.received.orders || []).map(normalizeWipOrder);
      data.carryover.orders = (data.carryover.orders || []).map(normalizeWipOrder);
      wipStatsData = data;
      wipOrderCache = new Map(
        [...data.received.orders, ...data.carryover.orders].map(order => [order.ma_dh, order])
      );
      M_WIP_MAP.stageP75 = data.stage_p75 || {};
      M_WIP_MAP.kpis = data.kpis || null;
      mUpdateWipKpis(M_WIP_MAP.kpis);
      return data;
    }

    function getWipOrdersForStage(stage) {
      if (!wipStatsData) return [];
      const received = wipStatsData.received.orders || [];
      const carryover = wipStatsData.carryover.orders || [];
      if (stage === 'carryover') return carryover;
      if (stage === 'done') return received.filter(o => o.current_stage === 'HOÀN TẤT');
      const wip = [
        ...received.filter(o => o.current_stage !== 'HOÀN TẤT'),
        ...carryover,
      ];
      if (stage === 'all') return wip;
      return wip.filter(o => o.current_stage === stage);
    }

    function wipProgress(o) {
      const stages = (o.stagesData || []).filter(s => !s.sk);
      if (!stages.length) return 0;
      const done = stages.filter(s => s.x).length;
      return Math.round(done / stages.length * 100);
    }

    function calcWipStageStats() {
      const totalOrders = getWipOrdersForStage('all');
      const completed = getWipOrdersForStage('done');
      const carryover = getWipOrdersForStage('carryover');
      const stats = [{
        stage: 'all',
        name: 'Tổng đang ôm',
        count: totalOrders.length,
        qty: totalOrders.reduce((sum, o) => sum + (Number(o.sl) || 0), 0),
        color: 'var(--terracotta)',
        buckets: wipBucketCounts(totalOrders),
      }];

      STAGE_NAMES.forEach(stage => {
        const orders = getWipOrdersForStage(stage);
        stats.push({
          stage,
          name: STAGE_SHORT[stage] || stage,
          count: orders.length,
          qty: orders.reduce((sum, o) => sum + (Number(o.sl) || 0), 0),
          color: STAGE_COLORS[stage] || 'var(--terracotta)',
          buckets: wipBucketCounts(orders),
        });
      });

      stats.push({
        stage: 'done',
        name: 'Hoàn tất hôm nay',
        count: completed.length,
        qty: completed.reduce((sum, o) => sum + (Number(o.sl) || 0), 0),
        color: '#16a34a',
        buckets: null,
      });
      stats.push({
        stage: 'carryover',
        name: 'Tồn qua ngày',
        count: carryover.length,
        qty: carryover.reduce((sum, o) => sum + (Number(o.sl) || 0), 0),
        color: '#dc2626',
        buckets: wipBucketCounts(carryover),
      });

      return stats;
    }

    function renderWipBuckets(buckets) {
      if (!buckets) return '';
      const cells = [
        { key: 'lt2',  label: '&lt;2h',  n: buckets.lt2 || 0 },
        { key: 'lt8',  label: '2-8h',    n: buckets.lt8 || 0 },
        { key: 'lt24', label: '8-24h',   n: buckets.lt24 || 0 },
        { key: 'gt24', label: '&gt;24h', n: buckets.gt24 || 0 },
      ];
      return `
        <div class="wip-stage-buckets" aria-label="Phân bố tuổi đơn ở stage">
          ${cells.map(c => `
            <div class="bk bk-${c.key} ${c.n === 0 ? 'is-zero' : ''}">
              <span class="bk-lbl">${c.label}</span>
              <span class="bk-num">${c.n}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderWipOrder(o) {
      const stageColor = STAGE_COLORS[o.current_stage] || 'var(--terracotta)';
      const patient = o.benh_nhan && o.benh_nhan !== 'nan' ? o.benh_nhan : '---';
      const progress = wipProgress(o);
      const receiveAge = Number(o.receive_age_days);
      const receiveMeta = Number.isFinite(receiveAge) && receiveAge > 0 ? ` · nhận ${receiveAge} ngày trước` : '';

      const ageMinutes = wipStageAgeMinutes(o);
      let ageHtml = '';
      if (ageMinutes != null && ageMinutes >= 60) {
        const ageStr = htmlSafe(formatAgeShort(ageMinutes));
        const cls = ageMinutes >= 1440 ? 'wip-order-age-danger'
                  : ageMinutes >= 480  ? 'wip-order-age-warn'
                  : '';
        ageHtml = cls
          ? ` · <span class="${cls}">ngâm ${ageStr}</span>`
          : ` · ngâm ${ageStr}`;
      }

      return `
        <div class="wip-order-card" data-ma-dh="${htmlSafe(o.ma_dh)}" style="border-left-color:${stageColor}">
          <div class="wip-order-top">
            <div class="wip-order-code">${htmlSafe(o.ma_dh || '---')}</div>
            <div class="wip-order-customer">${htmlSafe(o.khach_hang || '---')}</div>
          </div>
          <div class="wip-order-mid" style="margin-top:5px">
            <div class="wip-order-patient">${htmlSafe(patient)}</div>
            <div class="wip-order-qty">SL: ${Number(o.sl) || 0}</div>
          </div>
          <div class="wip-order-ph">${displayHtml(o.phuc_hinh || '---')}</div>
          <div class="wip-order-foot" style="margin-top:6px">
            <div class="wip-order-stage">Đang ở: ${htmlSafe(STAGE_SHORT[o.current_stage] || o.current_stage || '---')} · ${progress}%${ageHtml}${htmlSafe(receiveMeta)}</div>
            <div class="wip-order-deadline">${htmlSafe(formatDate(o.yc_ht))} ${htmlSafe(formatTime(o.yc_ht))}</div>
          </div>
        </div>
      `;
    }

    async function renderWipPanelLegacy(stage = wipSelectedStage, forceReload = false) {
      const nextStage = stage || 'all';
      if (nextStage !== wipSelectedStage) wipSelectedKtv = null;
      wipSelectedStage = nextStage;
      const content = document.getElementById('wipContent');
      const subtitle = document.getElementById('wipSubtitle');
      if (!content) return;

      const isInitialLoad = !wipStatsData;
      if (isInitialLoad || forceReload) {
        if (isInitialLoad) {
          content.innerHTML = '<div class="empty-state"><div class="icon">○</div><p>Đang tải WIP...</p></div>';
        }
        try {
          await loadWipStats();
        } catch (e) {
          content.innerHTML = `<div class="empty-state"><div class="icon">!</div><p>${htmlSafe(e.message || 'Không tải được WIP')}</p></div>`;
          if (subtitle) subtitle.textContent = 'Không tải được dữ liệu WIP';
          return;
        }
      }

      const fingerprint = computeWipFingerprint(wipStatsData) + '|' + wipSelectedStage + '|' + (wipSelectedKtv || '__null');
      if (fingerprint === lastWipFingerprint && !isInitialLoad) return;
      lastWipFingerprint = fingerprint;

      const stats = calcWipStageStats();
      const selected = stats.find(s => s.stage === wipSelectedStage) || stats[0];
      const fullOrders = sortOrdersByDeadline(getWipOrdersForStage(selected.stage));
      const ktvBreakdown = buildKtvBreakdown(fullOrders);

      const knownKtv = new Set(ktvBreakdown.entries.map(([n]) => n));
      const validFilter = wipSelectedKtv == null
        || wipSelectedKtv === '__none'
        || knownKtv.has(wipSelectedKtv);
      if (!validFilter) wipSelectedKtv = null;

      let orders = fullOrders;
      if (wipSelectedKtv != null) {
        orders = fullOrders.filter(o => {
          const k = ktvForOrder(o);
          if (wipSelectedKtv === '__none') return k == null;
          return k === wipSelectedKtv;
        });
      }

      const qty = orders.reduce((sum, o) => sum + (Number(o.sl) || 0), 0);
      const fullQty = fullOrders.reduce((sum, o) => sum + (Number(o.sl) || 0), 0);
      const received = wipStatsData.received || {};
      const carryover = wipStatsData.carryover || {};
      const subtitleText = wipSelectedKtv != null
        ? `${selected.name} → ${wipSelectedKtv === '__none' ? 'Chưa nhận' : wipSelectedKtv}: ${orders.length} đơn · ${qty} răng`
        : `${selected.name}: ${fullOrders.length} đơn · ${fullQty} răng`;
      if (subtitle) subtitle.textContent = subtitleText;

      const totalWipOrders = (received.wip_orders || 0) + (carryover.total_orders || 0);
      const totalWipQty = (received.wip_qty || 0) + (carryover.total_qty || 0);
      const overviewHtml = `
        <div class="wip-overview">
          <div class="wip-overview-item">
            <div class="wip-overview-label">Nhận hôm nay</div>
            <div class="wip-overview-value">${received.total_orders || 0}</div>
            <div class="wip-overview-meta">${received.total_qty || 0} răng</div>
          </div>
          <div class="wip-overview-item">
            <div class="wip-overview-label">Tổng đang ôm</div>
            <div class="wip-overview-value">${totalWipOrders}</div>
            <div class="wip-overview-meta">${totalWipQty} răng</div>
          </div>
          <div class="wip-overview-item alert">
            <div class="wip-overview-label">Tồn qua ngày</div>
            <div class="wip-overview-value">${carryover.total_orders || 0}</div>
            <div class="wip-overview-meta">${carryover.total_qty || 0} răng</div>
          </div>
        </div>
      `;

      const summaryHtml = stats.map(s => `
        <button class="wip-stage-card ${s.stage === selected.stage ? 'active' : ''}" type="button" onclick="renderWipPanel('${htmlSafe(s.stage)}')" style="border-left-color:${s.color}">
          <div class="wip-stage-name">${htmlSafe(s.name)}</div>
          <div class="wip-stage-count">${s.count}</div>
          <div class="wip-stage-meta">${s.qty} răng chờ</div>
          ${renderWipBuckets(s.buckets)}
        </button>
      `).join('');

      const showKtvSummary = selected.stage !== 'done' && fullOrders.length > 0;
      const ktvSummaryHtml = showKtvSummary ? `
        <div class="wip-ktv-summary">
          <div class="wip-ktv-summary-label">KTV vừa hoàn tất stage trước (click để lọc):</div>
          <div class="wip-ktv-chips-row">
            ${wipSelectedKtv != null ? `
              <button class="wip-ktv-chip wip-ktv-clear" type="button" onclick="filterWipByKtv(null)">
                <span class="ktv-name">✕ Bỏ lọc</span>
              </button>
            ` : ''}
            ${ktvBreakdown.entries.map(([name, n]) => `
              <button class="wip-ktv-chip ${wipSelectedKtv === name ? 'active' : ''}" type="button" onclick="filterWipByKtv('${htmlSafe(name)}')">
                <span class="ktv-name">${htmlSafe(name)}</span>
                <span class="ktv-count">${n}</span>
              </button>
            `).join('')}
            ${ktvBreakdown.unclaimed > 0 ? `
              <button class="wip-ktv-chip wip-ktv-unclaimed ${wipSelectedKtv === '__none' ? 'active' : ''}" type="button" onclick="filterWipByKtv('__none')">
                <span class="ktv-name">Chưa có ai</span>
                <span class="ktv-count">${ktvBreakdown.unclaimed}</span>
              </button>
            ` : ''}
          </div>
        </div>
      ` : '';

      const listHtml = orders.length
        ? `<div class="wip-order-list">${orders.map(renderWipOrder).join('')}</div>`
        : `<div class="empty-state"><div class="icon">○</div><p>${wipSelectedKtv != null ? 'KTV này không có đơn ở stage hiện tại' : 'Không có đơn WIP'}</p></div>`;

      content.innerHTML = `
        ${overviewHtml}
        <div class="wip-summary">${summaryHtml}</div>

          <span>${htmlSafe(selected.name)}</span>

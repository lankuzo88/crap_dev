        </div>
        ${ktvSummaryHtml}
        ${listHtml}
      `;
    }

    function mWipClamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    function mWipStageLabel(stage) {
      return STAGE_SHORT[stage] || String(stage || '').replace('SÁP/Cadcam', 'SÁP');
    }

    function mWipParseDateTime(value) {
      const raw = String(value || '').trim();
      if (!raw) return null;
      let m = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);
      if (m) return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]), Number(m[4] || 23), Number(m[5] || 59));
      m = raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/);
      if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), Number(m[4] || 23), Number(m[5] || 59));
      const parsed = new Date(raw);
      return Number.isNaN(parsed.getTime()) ? null : parsed;
    }

    function mWipDeadlineMinutes(o) {
      const d = mWipParseDateTime(o?.yc_ht || o?.yc_giao);
      return d ? Math.floor((d.getTime() - Date.now()) / 60000) : null;
    }

    const M_WIP_WORK_START_H = 8;
    const M_WIP_WORK_END_H   = 21;

    function mWipWorkingMinutesSince(startMs, nowMs) {
      if (startMs == null) return null;
      if (nowMs <= startMs) return 0;
      let total = 0;
      let cursor = startMs;
      while (cursor < nowMs) {
        const d = new Date(cursor);
        const dayStart = new Date(d.getFullYear(), d.getMonth(), d.getDate(), M_WIP_WORK_START_H, 0, 0, 0).getTime();
        const dayEnd   = new Date(d.getFullYear(), d.getMonth(), d.getDate(), M_WIP_WORK_END_H,   0, 0, 0).getTime();
        const segStart = Math.max(cursor, dayStart);
        const segEnd   = Math.min(nowMs, dayEnd);
        if (segEnd > segStart) total += segEnd - segStart;
        cursor = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1, 0, 0, 0, 0).getTime();
      }
      return Math.floor(total / 60000);
    }

    function mWipStageWorkingAge(o) {
      if (!o || o.current_stage === 'HOÀN TẤT') return null;
      const started = o.current_stage_started_at;
      if (typeof started !== 'number' || started <= 0) return null;
      return mWipWorkingMinutesSince(started, Date.now());
    }

    // Ngâm theo working-minutes (chỉ tính 8h-21h), so với P75 lịch sử của từng stage:
    //   warn   (vàng)   ≥ 1× P75
    //   alert  (cam)    ≥ 2× P75
    //   danger (đỏ đậm) ≥ 3× P75
    // Fallback nếu thiếu P75: ngưỡng cứng 12h/24h/48h (working).
    function mWipComputeRisk(o) {
      const age = mWipStageWorkingAge(o);
      if (age == null) return 'normal';
      const stage = o && o.current_stage;
      const baseline = stage && M_WIP_MAP.stageP75 && M_WIP_MAP.stageP75[stage];
      const p75 = baseline && baseline.p75 > 0 ? baseline.p75 : null;
      if (p75 == null) {
        if (age >= 2880) return 'danger';
        if (age >= 1440) return 'alert';
        if (age >= 720)  return 'warn';
        return 'normal';
      }
      if (age >= 3 * p75) return 'danger';
      if (age >= 2 * p75) return 'alert';
      if (age >= p75)     return 'warn';
      return 'normal';
    }

    function mWipOrderRisk(o) {
      return o && o._wipRisk ? o._wipRisk : mWipComputeRisk(o);
    }

    const M_WIP_RISK_COLOR = {
      normal: null,
      warn:   '#eab308',
      alert:  '#ea580c',
      danger: '#991b1b',
    };
    const M_WIP_RISK_BG = {
      normal: '#ffffff',
      warn:   '#fefce8',
      alert:  '#fff7ed',
      danger: '#fef2f2',
    };

    function mWipOrderMatchesFilter(o) {
      const f = M_WIP_MAP.filter;
      if (f === 'alert') return mWipOrderRisk(o) !== 'normal';
      if (f === 'unclaimed') {
        const k = o && '_wipKtv' in o ? o._wipKtv : ktvForOrder(o);
        return !k;
      }
      if (f === 'deadline') {
        const m = o && '_wipDeadlineMin' in o ? o._wipDeadlineMin : mWipDeadlineMinutes(o);
        return m != null && m <= 240;
      }
      return true;
    }

    function mWipDeriveStageStartedAt(stages, fallbackTs) {
      if (!Array.isArray(stages) || !stages.length) {
        return fallbackTs == null ? null : fallbackTs;
      }
      let latestDoneAt = null;
      for (const s of stages) {
        if (!s || s.sk || !s.x) continue;
        const parsed = mWipParseDateTime(s.t);
        const ts = parsed ? parsed.getTime() : null;
        if (ts != null && (latestDoneAt == null || ts > latestDoneAt)) latestDoneAt = ts;
      }
      if (latestDoneAt != null) return latestDoneAt;
      return fallbackTs == null ? null : fallbackTs;
    }

    function mWipMergeWithMain(wipOrder, mainOrder) {
      if (!mainOrder) return wipOrder;
      const merged = {
        ...wipOrder,
        stagesData:    Array.isArray(mainOrder.stagesData) ? mainOrder.stagesData : wipOrder.stagesData,
        current_stage: mainOrder.current_stage || wipOrder.current_stage,
        yc_ht:         mainOrder.yc_ht    || wipOrder.yc_ht,
        yc_giao:       mainOrder.yc_giao  || wipOrder.yc_giao,
        khach_hang:    mainOrder.khach_hang || wipOrder.khach_hang,
        benh_nhan:     mainOrder.benh_nhan  || wipOrder.benh_nhan,
        sl:            Number(mainOrder.sl) || wipOrder.sl,
        phuc_hinh:     mainOrder.phuc_hinh || wipOrder.phuc_hinh,
        loai_lenh:     mainOrder.loai_lenh || wipOrder.loai_lenh,
        ghi_chu:       mainOrder.ghi_chu || wipOrder.ghi_chu,
        ghi_chu_sx:    mainOrder.ghi_chu_sx || wipOrder.ghi_chu_sx,
        keylab_sx_info: mainOrder.keylab_sx_info || wipOrder.keylab_sx_info,
        routed_to:     mainOrder.routed_to || wipOrder.routed_to,
        delay_report:  mainOrder.delay_report || null,
      };
      const fallback = wipOrder.current_stage_started_at
        ?? (mWipParseDateTime(wipOrder.nhan)?.getTime() ?? null);
      merged.current_stage_started_at = mWipDeriveStageStartedAt(merged.stagesData, fallback);
      merged.current_stage_age_minutes = merged.current_stage_started_at != null
        ? Math.max(0, Math.floor((Date.now() - merged.current_stage_started_at) / 60000))
        : null;
      return merged;
    }

    function mWipMapOrders() {
      const wipOrders = getWipOrdersForStage('all');
      const mainByMa = new Map((allOrders || []).map(o => [o.ma_dh, o]));
      const merged = wipOrders.map(o => {
        const base = { ...o, yc_ht: o.yc_ht || o.yc_giao || '' };
        return mWipMergeWithMain(base, mainByMa.get(o.ma_dh));
      });
      return sortOrdersByDeadline(merged);
    }

    function mBuildWipMapLayout(mode = M_WIP_MAP.layoutMode || 'compact') {
      const canvas = M_WIP_MAP.canvas;
      const cachedW = M_WIP_MAP.rect && M_WIP_MAP.rect.width;
      const width = cachedW || (canvas ? canvas.getBoundingClientRect().width : window.innerWidth);
      const useTwoCols = width >= 560;
      const compact = mode === 'compact';
      const cols = useTwoCols ? 2 : 1;
      const margin = 28;
      const gapX = 22;
      const gapY = compact ? 10 : 18;
      const top = 24;
      const stageW = useTwoCols ? 260 : 330;
      const stageMinH = compact ? 132 : 208;
      const orders = mWipMapOrders();
      const stages = [];
      const colHeights = Array(cols).fill(top);
      M_WIP_MAP.layoutMode = mode;
      M_WIP_MAP.textCache.clear();
      M_WIP_MAP.riskStamp = Date.now();
      for (const order of orders) {
        order._wipKtv = ktvForOrder(order);
        order._wipDeadlineMin = mWipDeadlineMinutes(order);
        order._wipRisk = mWipComputeRisk(order);
      }

      STAGE_NAMES.forEach((stage, idx) => {
        const stageOrders = orders.filter(o => o.current_stage === stage);
        const laneMap = new Map();
        for (const order of stageOrders) {
          const laneName = order._wipKtv || M_WIP_UNCLAIMED;
          if (!laneMap.has(laneName)) laneMap.set(laneName, []);
          laneMap.get(laneName).push(order);
        }
        const laneNames = [...laneMap.keys()].sort((a, b) => {
          if (a === M_WIP_UNCLAIMED) return -1;
          if (b === M_WIP_UNCLAIMED) return 1;
          return laneMap.get(b).length - laneMap.get(a).length || a.localeCompare(b, 'vi');
        });
        const col = useTwoCols ? idx % 2 : 0;
        const x = margin + col * (stageW + gapX);
        const y = colHeights[col];
        let laneY = y + 78;
        const lanes = laneNames.map(name => {
          const laneOrders = laneMap.get(name);
          const cardsPerRow = useTwoCols ? 2 : 2;
          const rows = Math.max(1, Math.ceil(laneOrders.length / cardsPerRow));
          const laneH = 34 + rows * 64 + 8;
          const lane = { name, orders: laneOrders, x: x + 10, y: laneY, w: stageW - 20, h: laneH, cardsPerRow };
          laneY += laneH + 10;
          return lane;
        });
        const dotCols = Math.max(7, Math.floor((stageW - 32) / 24));
        const dotRows = Math.ceil(Math.min(stageOrders.length, 140) / dotCols);
        const compactStageH = 106 + Math.max(34, dotRows * 21 + 18);
        const stageH = compact ? Math.max(stageMinH, compactStageH) : Math.max(stageMinH, laneY - y + 10);
        let alertCount = 0;
        let dangerCount = 0;
        let unclaimedCount = 0;
        let qtySum = 0;
        for (const o of stageOrders) {
          if (o._wipRisk !== 'normal') alertCount++;
          if (o._wipRisk === 'danger') dangerCount++;
          if (!o._wipKtv) unclaimedCount++;
          qtySum += Number(o.sl) || 0;
        }
        stages.push({
          stage,
          orders: stageOrders,
          lanes,
          alerts: alertCount,
          dangers: dangerCount,
          unclaimed: unclaimedCount,
          qty: qtySum,
          x,
          y,
          w: stageW,
          h: stageH,
          color: STAGE_COLORS[stage] || '#c4836f',
        });
        colHeights[col] = y + stageH + gapY;
      });

      M_WIP_MAP.worldW = margin * 2 + cols * stageW + (cols - 1) * gapX;
      M_WIP_MAP.worldH = Math.max(...colHeights) + 76;
      M_WIP_MAP.layout = { stages, orders, cols };
      return M_WIP_MAP.layout;
    }

    function mEnsureWipCanvasShell() {
      const content = document.getElementById('wipContent');
      if (!content) return null;
      if (!document.getElementById('wipCanvas')) {
        content.className = 'wip-content wip-map-shell';
        content.innerHTML = `
          <canvas id="wipCanvas"></canvas>
          <div class="wip-kpi-bar" id="wipKpiBar">
            <div class="wip-kpi" id="wipKpiThroughput">
              <div class="wip-kpi-label">Hôm nay</div>
              <div class="wip-kpi-value">—</div>
              <div class="wip-kpi-meta">—</div>
            </div>
            <div class="wip-kpi" id="wipKpiDeadline">
              <div class="wip-kpi-label">Sát hạn</div>
              <div class="wip-kpi-value">—</div>
              <div class="wip-kpi-meta">—</div>
            </div>
            <div class="wip-kpi" id="wipKpiBottleneck">
              <div class="wip-kpi-label">Nút thắt</div>
              <div class="wip-kpi-value">—</div>
              <div class="wip-kpi-meta">—</div>
            </div>
            <div class="wip-kpi" id="wipKpiBalance">
              <div class="wip-kpi-label">Phân công</div>
              <div class="wip-kpi-value">—</div>
              <div class="wip-kpi-meta">—</div>
            </div>
          </div>
          <div class="wip-map-hud">
            <div class="wip-map-status" id="wipMapStatus">Đang tải WIP...</div>
            <div class="wip-map-tools">
              <button class="wip-map-btn" type="button" onclick="mWipResetView()">Tổng</button>
              <button class="wip-map-btn" type="button" onclick="mWipZoomBy(1.22)">+</button>
              <button class="wip-map-btn" type="button" onclick="mWipZoomBy(0.82)">-</button>
              <button class="wip-map-btn active" type="button" data-m-wip-filter="all" onclick="mWipSetFilter('all')">Tất cả</button>
              <button class="wip-map-btn" type="button" data-m-wip-filter="alert" onclick="mWipSetFilter('alert')">Cảnh báo</button>
              <button class="wip-map-btn" type="button" data-m-wip-filter="unclaimed" onclick="mWipSetFilter('unclaimed')">Chờ</button>
              <button class="wip-map-btn" type="button" data-m-wip-filter="deadline" onclick="mWipSetFilter('deadline')">Hạn</button>
            </div>
          </div>
          <div class="wip-map-legend">
            <span><i style="background:#eab308"></i>Vượt P75 stage</span>
            <span><i style="background:#ea580c"></i>≥ 2× P75</span>
            <span><i style="background:#991b1b"></i>≥ 3× P75</span>
            <span><i style="background:#94a3b8"></i>Chờ nhận</span>
          </div>`;
      }
      return document.getElementById('wipCanvas');
    }

    function mInitWipCanvas() {
      const canvas = mEnsureWipCanvasShell();
      if (!canvas) return;
      M_WIP_MAP.canvas = canvas;
      M_WIP_MAP.ctx = canvas.getContext('2d');
      if (M_WIP_MAP.initialized) {
        mResizeWipCanvas();
        return;
      }
      M_WIP_MAP.initialized = true;

      canvas.addEventListener('wheel', e => {
        e.preventDefault();
        mWipZoomAt(Math.exp(-e.deltaY * 0.0012), e.offsetX, e.offsetY);
      }, { passive: false });

      canvas.addEventListener('pointerdown', e => {
        canvas.setPointerCapture?.(e.pointerId);
        mWipSyncTargetToCamera();
        M_WIP_MAP.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        M_WIP_MAP.dragMoved = false;
        M_WIP_MAP.velocityX = 0;
        M_WIP_MAP.velocityY = 0;
        M_WIP_MAP.lastMoveSample = { x: e.clientX, y: e.clientY, t: performance.now() };
        canvas.classList.add('dragging');
        if (M_WIP_MAP.pointers.size === 1) {
          M_WIP_MAP.dragStart = { x: e.clientX, y: e.clientY, panX: M_WIP_MAP.panX, panY: M_WIP_MAP.panY };
          M_WIP_MAP.pinchStart = null;
        } else if (M_WIP_MAP.pointers.size === 2) {
          const pts = [...M_WIP_MAP.pointers.values()];
          const center = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
          const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          mWipRefreshRect();
          const rect = M_WIP_MAP.rect;
          M_WIP_MAP.pinchStart = {
            dist,
            scale: M_WIP_MAP.scale,
            worldX: (center.x - rect.left - M_WIP_MAP.panX) / M_WIP_MAP.scale,
            worldY: (center.y - rect.top - M_WIP_MAP.panY) / M_WIP_MAP.scale,
          };
        }
      });

      canvas.addEventListener('pointermove', e => {
        if (!M_WIP_MAP.pointers.has(e.pointerId)) {
          if (e.pointerType !== 'touch') {
            const rect = M_WIP_MAP.rect;
            M_WIP_MAP.hover = mWipHitTest((e.clientX - rect.left - M_WIP_MAP.panX) / M_WIP_MAP.scale, (e.clientY - rect.top - M_WIP_MAP.panY) / M_WIP_MAP.scale);
          }
          return;
        }
        M_WIP_MAP.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (M_WIP_MAP.pointers.size === 2 && M_WIP_MAP.pinchStart) {
          M_WIP_MAP.velocityX = 0;
          M_WIP_MAP.velocityY = 0;
          const pts = [...M_WIP_MAP.pointers.values()];
          const center = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
          const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          const next = mWipClamp(M_WIP_MAP.pinchStart.scale * (dist / Math.max(1, M_WIP_MAP.pinchStart.dist)), M_WIP_MAP.minScale, M_WIP_MAP.maxScale);
          const rect = M_WIP_MAP.rect;
          M_WIP_MAP.scale = next;
          M_WIP_MAP.panX = center.x - rect.left - M_WIP_MAP.pinchStart.worldX * next;
          M_WIP_MAP.panY = center.y - rect.top - M_WIP_MAP.pinchStart.worldY * next;
          const clamped = mWipClampPan(M_WIP_MAP.scale, M_WIP_MAP.panX, M_WIP_MAP.panY);
          M_WIP_MAP.panX = clamped.panX;
          M_WIP_MAP.panY = clamped.panY;
          mWipSyncTargetToCamera();
          M_WIP_MAP.dragMoved = true;
          M_WIP_MAP.needsFit = false;
          return;
        }
        if (M_WIP_MAP.pointers.size === 1 && M_WIP_MAP.dragStart) {
          const now = performance.now();
          const sample = M_WIP_MAP.lastMoveSample;
          if (sample) {
            const dt = Math.max(12, now - sample.t);
            const vx = (e.clientX - sample.x) / dt;
            const vy = (e.clientY - sample.y) / dt;
            M_WIP_MAP.velocityX = M_WIP_MAP.velocityX * 0.65 + vx * 0.35;
            M_WIP_MAP.velocityY = M_WIP_MAP.velocityY * 0.65 + vy * 0.35;
          }
          M_WIP_MAP.lastMoveSample = { x: e.clientX, y: e.clientY, t: now };
          const dx = e.clientX - M_WIP_MAP.dragStart.x;
          const dy = e.clientY - M_WIP_MAP.dragStart.y;
          if (Math.abs(dx) + Math.abs(dy) > 4) M_WIP_MAP.dragMoved = true;
          M_WIP_MAP.panX = M_WIP_MAP.dragStart.panX + dx;
          M_WIP_MAP.panY = M_WIP_MAP.dragStart.panY + dy;
          const clamped = mWipClampPan(M_WIP_MAP.scale, M_WIP_MAP.panX, M_WIP_MAP.panY);
          M_WIP_MAP.panX = clamped.panX;
          M_WIP_MAP.panY = clamped.panY;
          mWipSyncTargetToCamera();
          M_WIP_MAP.needsFit = false;
        }
      });

      const endPointer = e => {
        const wasTap = !M_WIP_MAP.dragMoved && M_WIP_MAP.pointers.size === 1;
        M_WIP_MAP.pointers.delete(e.pointerId);
        if (M_WIP_MAP.pointers.size === 0) {
          canvas.classList.remove('dragging');
          M_WIP_MAP.dragStart = null;
          M_WIP_MAP.pinchStart = null;
          M_WIP_MAP.lastMoveSample = null;
          if (wasTap) {
            const rect = M_WIP_MAP.rect;
            const hit = mWipHitTest((e.clientX - rect.left - M_WIP_MAP.panX) / M_WIP_MAP.scale, (e.clientY - rect.top - M_WIP_MAP.panY) / M_WIP_MAP.scale);
            if (hit?.type === 'order') {
              const order = allOrders.find(o => o.ma_dh === hit.id) || wipOrderCache.get(hit.id);
              if (order) showOrderDetail(order);
            } else if (hit?.type === 'stage') {
              mWipFocusStage(hit.stage);
            }
          } else if (M_WIP_MAP.dragMoved) {
            const speed = Math.hypot(M_WIP_MAP.velocityX, M_WIP_MAP.velocityY);
            if (speed > 0.035) {
              mWipSetCamera(
                M_WIP_MAP.scale,
                M_WIP_MAP.panX + M_WIP_MAP.velocityX * 260,
                M_WIP_MAP.panY + M_WIP_MAP.velocityY * 260
              );
            }
          }
        }
      };
      canvas.addEventListener('pointerup', endPointer);
      canvas.addEventListener('pointercancel', endPointer);
      canvas.addEventListener('dblclick', () => mWipResetView());
      window.addEventListener('resize', () => {
        mResizeWipCanvas();
        if (M_WIP_MAP.layout) mBuildWipMapLayout(M_WIP_MAP.layoutMode);
        if (M_WIP_MAP.needsFit) mWipFitMap(true);
      });
      window.addEventListener('orientationchange', () => {
        mResizeWipCanvas();
        if (M_WIP_MAP.layout) mBuildWipMapLayout(M_WIP_MAP.layoutMode);
        if (M_WIP_MAP.needsFit) mWipFitMap(true);
      });
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) mWipRefreshRect();
      });
      mResizeWipCanvas();
    }

    function mResizeWipCanvas() {
      const canvas = M_WIP_MAP.canvas;
      if (!canvas) return;
      const rect = canvas.getBoundingClientRect();
      M_WIP_MAP.rect = { left: rect.left, top: rect.top, width: rect.width, height: rect.height };
      const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      M_WIP_MAP.dpr = dpr;
      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      M_WIP_MAP.textCache.clear();
    }

    function mWipRefreshRect() {
      const canvas = M_WIP_MAP.canvas;
      if (!canvas) return;
      const rect = canvas.getBoundingClientRect();
      M_WIP_MAP.rect = { left: rect.left, top: rect.top, width: rect.width, height: rect.height };
    }

    function mSetWipMapStatus(text) {
      const el = document.getElementById('wipMapStatus');
      if (el) el.textContent = text || '';
      const subtitle = document.getElementById('wipSubtitle');
      if (subtitle && text) subtitle.textContent = text;
    }

    function mWipUpdateToolbar() {
      document.querySelectorAll('[data-m-wip-filter]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mWipFilter === M_WIP_MAP.filter);
      });
    }

    function mWipDesiredLayoutMode(scale = M_WIP_MAP.targetScale || M_WIP_MAP.scale) {
      return scale < 0.72 ? 'compact' : 'detail';
    }

    function mWipEnsureLayoutMode(mode) {
      if (!M_WIP_MAP.layout || M_WIP_MAP.layoutMode !== mode) {
        mBuildWipMapLayout(mode);
      }
    }

    function mWipClampPan(scale, panX, panY) {
      const canvas = M_WIP_MAP.canvas;
      if (!canvas) return { panX, panY };
      const rect = M_WIP_MAP.rect;
      const safeX = 24;
      const topSafe = 180;
      const bottomSafe = 54;
      const scaledW = M_WIP_MAP.worldW * scale;
      const scaledH = M_WIP_MAP.worldH * scale;
      let nextX = panX;
      let nextY = panY;

      if (scaledW <= rect.width - safeX * 2) {
        nextX = (rect.width - scaledW) / 2;
      } else {
        nextX = mWipClamp(panX, rect.width - scaledW - safeX, safeX);
      }

      if (scaledH <= rect.height - topSafe - bottomSafe) {
        nextY = topSafe + (rect.height - topSafe - bottomSafe - scaledH) / 2;
      } else {
        nextY = mWipClamp(panY, rect.height - scaledH - bottomSafe, topSafe);
      }
      return { panX: nextX, panY: nextY };
    }

    function mWipSwitchLayoutMode(mode) {
      if (!M_WIP_MAP.layout || M_WIP_MAP.layoutMode === mode) return;
      const canvas = M_WIP_MAP.canvas;
      if (!canvas) return;
      const rect = M_WIP_MAP.rect;
      const sx = rect.width / 2;
      const sy = rect.height / 2;
      const ratioX = mWipClamp(((sx - M_WIP_MAP.panX) / M_WIP_MAP.scale) / Math.max(1, M_WIP_MAP.worldW), 0, 1);
      const ratioY = mWipClamp(((sy - M_WIP_MAP.panY) / M_WIP_MAP.scale) / Math.max(1, M_WIP_MAP.worldH), 0, 1);
      mBuildWipMapLayout(mode);
      const current = mWipClampPan(M_WIP_MAP.scale, sx - ratioX * M_WIP_MAP.worldW * M_WIP_MAP.scale, sy - ratioY * M_WIP_MAP.worldH * M_WIP_MAP.scale);
      M_WIP_MAP.panX = current.panX;
      M_WIP_MAP.panY = current.panY;
      const target = mWipClampPan(M_WIP_MAP.targetScale, sx - ratioX * M_WIP_MAP.worldW * M_WIP_MAP.targetScale, sy - ratioY * M_WIP_MAP.worldH * M_WIP_MAP.targetScale);
      M_WIP_MAP.targetPanX = target.panX;
      M_WIP_MAP.targetPanY = target.panY;
    }

    function mWipMaybeSwitchLayoutMode() {
      if (M_WIP_MAP.pointers.size) return;
      if (Math.abs((M_WIP_MAP.targetScale || M_WIP_MAP.scale) - M_WIP_MAP.scale) > 0.035) return;
      const scale = M_WIP_MAP.scale;
      if (M_WIP_MAP.layoutMode === 'compact' && scale > 0.82) mWipSwitchLayoutMode('detail');
      else if (M_WIP_MAP.layoutMode === 'detail' && scale < 0.58) mWipSwitchLayoutMode('compact');
    }

    function mWipMaybeRefreshRisk(now) {
      if (M_WIP_MAP.pointers.size) return;
      if (!M_WIP_MAP.layout) return;
      if (now - (M_WIP_MAP.riskStamp || 0) < 30000) return;
      M_WIP_MAP.riskStamp = now;
      for (const o of M_WIP_MAP.layout.orders) {
        o._wipDeadlineMin = mWipDeadlineMinutes(o);
        o._wipRisk = mWipComputeRisk(o);
      }
    }

    function mWipSetCamera(scale, panX, panY, immediate = false) {
      M_WIP_MAP.targetScale = mWipClamp(scale, M_WIP_MAP.minScale, M_WIP_MAP.maxScale);
      const clamped = mWipClampPan(M_WIP_MAP.targetScale, panX, panY);
      M_WIP_MAP.targetPanX = clamped.panX;
      M_WIP_MAP.targetPanY = clamped.panY;
      if (immediate) {
        M_WIP_MAP.scale = M_WIP_MAP.targetScale;
        M_WIP_MAP.panX = M_WIP_MAP.targetPanX;
        M_WIP_MAP.panY = M_WIP_MAP.targetPanY;
      }
    }

    function mWipSyncTargetToCamera() {
      M_WIP_MAP.targetScale = M_WIP_MAP.scale;
      M_WIP_MAP.targetPanX = M_WIP_MAP.panX;
      M_WIP_MAP.targetPanY = M_WIP_MAP.panY;
    }

    function mStepWipCamera() {
      const ease = M_WIP_MAP.pointers.size ? 1 : 0.24;
      const ds = M_WIP_MAP.targetScale - M_WIP_MAP.scale;
      const dx = M_WIP_MAP.targetPanX - M_WIP_MAP.panX;
      const dy = M_WIP_MAP.targetPanY - M_WIP_MAP.panY;
      if (Math.abs(ds) < 0.0008 && Math.abs(dx) < 0.25 && Math.abs(dy) < 0.25) {
        M_WIP_MAP.scale = M_WIP_MAP.targetScale;
        M_WIP_MAP.panX = M_WIP_MAP.targetPanX;
        M_WIP_MAP.panY = M_WIP_MAP.targetPanY;
        return;
      }
      M_WIP_MAP.scale += ds * ease;
      M_WIP_MAP.panX += dx * ease;
      M_WIP_MAP.panY += dy * ease;
      const clamped = mWipClampPan(M_WIP_MAP.scale, M_WIP_MAP.panX, M_WIP_MAP.panY);
      M_WIP_MAP.panX = clamped.panX;
      M_WIP_MAP.panY = clamped.panY;
    }

    function mWipFitMap(immediate = false) {
      const canvas = M_WIP_MAP.canvas;
      if (!canvas) return;
      mWipEnsureLayoutMode('compact');
      const rect = M_WIP_MAP.rect;
      const scale = mWipClamp(Math.min((rect.width - 18) / M_WIP_MAP.worldW, (rect.height - 220) / M_WIP_MAP.worldH), M_WIP_MAP.minScale, 0.9);
      mWipSetCamera(scale, Math.max(8, (rect.width - M_WIP_MAP.worldW * scale) / 2), 184, immediate);
      M_WIP_MAP.needsFit = false;
    }

    function mWipResetView() {
      M_WIP_MAP.needsFit = true;
      mWipFitMap();
    }

    function mWipZoomAt(factor, sx, sy) {
      const old = M_WIP_MAP.targetScale || M_WIP_MAP.scale;
      const next = mWipClamp(old * factor, M_WIP_MAP.minScale, M_WIP_MAP.maxScale);
      const oldPanX = Number.isFinite(M_WIP_MAP.targetPanX) ? M_WIP_MAP.targetPanX : M_WIP_MAP.panX;
      const oldPanY = Number.isFinite(M_WIP_MAP.targetPanY) ? M_WIP_MAP.targetPanY : M_WIP_MAP.panY;
      const wx = (sx - oldPanX) / old;
      const wy = (sy - oldPanY) / old;
      mWipSetCamera(next, sx - wx * next, sy - wy * next);
      M_WIP_MAP.needsFit = false;
    }

    function mWipZoomBy(factor) {
      const canvas = M_WIP_MAP.canvas;
      if (!canvas) return;
      const rect = M_WIP_MAP.rect;
      mWipZoomAt(factor, rect.width / 2, rect.height / 2);
    }

    function mWipSetFilter(filter) {
      M_WIP_MAP.filter = filter || 'all';
      mWipUpdateToolbar();
      mUpdateWipMapTitle();
    }

    function mWipFocusStage(stage) {
      const canvas = M_WIP_MAP.canvas;
      if (!canvas || !M_WIP_MAP.layout) return;
      mWipSwitchLayoutMode('detail');
      mWipEnsureLayoutMode('detail');
      const detailLayout = M_WIP_MAP.layout;
      const s = detailLayout.stages.find(x => x.stage === stage);
      if (!s) return;
      const rect = M_WIP_MAP.rect;
      const scale = mWipClamp(Math.min(1.18, (rect.width - 28) / s.w), M_WIP_MAP.minScale, M_WIP_MAP.maxScale);
      mWipSetCamera(scale, rect.width / 2 - (s.x + s.w / 2) * scale, 188 - s.y * scale);
      M_WIP_MAP.needsFit = false;
    }

    function mWipHitTest(wx, wy) {
      for (let i = M_WIP_MAP.hitItems.length - 1; i >= 0; i--) {
        const it = M_WIP_MAP.hitItems[i];
        if (wx >= it.x && wx <= it.x + it.w && wy >= it.y && wy <= it.y + it.h) return it;
      }
      return null;
    }

    function mStartWipMapLoop() {
      if (M_WIP_MAP.animating) return;
      M_WIP_MAP.animating = true;
      requestAnimationFrame(mDrawWipMapFrame);
    }

    function mDrawWipMapFrame(now) {
      const panel = document.getElementById('wipPanel');
      if (!panel?.classList.contains('open')) {
        M_WIP_MAP.animating = false;
        return;
      }
      const t = now || performance.now();
      mStepWipCamera();
      mWipMaybeSwitchLayoutMode();
      mWipMaybeRefreshRisk(Date.now());
      mDrawWipMap(t);
      requestAnimationFrame(mDrawWipMapFrame);
    }

    function mRoundRect(ctx, x, y, w, h, r) {
      const rr = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.arcTo(x + w, y, x + w, y + h, rr);
      ctx.arcTo(x + w, y + h, x, y + h, rr);
      ctx.arcTo(x, y + h, x, y, rr);
      ctx.arcTo(x, y, x + w, y, rr);
      ctx.closePath();
    }

    function mCanvasText(ctx, text, x, y, maxW, font, color, align = 'left') {
      ctx.font = font;
      ctx.fillStyle = color;
      ctx.textAlign = align;
      ctx.textBaseline = 'alphabetic';
      const raw = String(text || '');
      const limit = Math.max(0, Math.round(maxW));
      const key = font + '\0' + limit + '\0' + raw;
      const cache = M_WIP_MAP.textCache;
      let s = cache.get(key);
      if (s === undefined) {
        if (ctx.measureText(raw).width <= maxW) {
          s = raw;
        } else {
          let lo = 1;
          let hi = raw.length;
          while (lo < hi) {
            const mid = (lo + hi + 1) >> 1;
            if (ctx.measureText(raw.slice(0, mid) + '...').width <= maxW) lo = mid;
            else hi = mid - 1;
          }
          s = raw.slice(0, lo) + '...';
        }
        if (cache.size > 2000) cache.clear();
        cache.set(key, s);
      }
      ctx.fillText(s, x, y);
    }

    function mDrawWipMap(now) {
      const canvas = M_WIP_MAP.canvas;
      const ctx = M_WIP_MAP.ctx;
      const layout = M_WIP_MAP.layout;
      if (!canvas || !ctx || !layout) return;
      const rect = M_WIP_MAP.rect;
      const dpr = M_WIP_MAP.dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, rect.width, rect.height);
      ctx.fillStyle = '#f7f2ee';
      ctx.fillRect(0, 0, rect.width, rect.height);
      ctx.save();
      ctx.translate(M_WIP_MAP.panX, M_WIP_MAP.panY);
      ctx.scale(M_WIP_MAP.scale, M_WIP_MAP.scale);
      M_WIP_MAP.hitItems = [];
      mDrawWipWorld(ctx, layout, now);
      ctx.restore();
    }

    function mDrawWipWorld(ctx, layout, now) {
      const received = wipStatsData?.received || {};
      const carryover = wipStatsData?.carryover || {};
      const totalWipOrders = (received.wip_orders || 0) + (carryover.total_orders || 0);
      const totalWipQty = (received.wip_qty || 0) + (carryover.total_qty || 0);
      let alertCount = 0;
      let dangerCount = 0;
      let unclaimedCount = 0;
      for (const o of layout.orders) {
        const r = o._wipRisk || mWipOrderRisk(o);
        if (r !== 'normal') alertCount++;
        if (r === 'danger') dangerCount++;
        const k = '_wipKtv' in o ? o._wipKtv : ktvForOrder(o);
        if (!k) unclaimedCount++;
      }
      const pulse = 0.55 + Math.sin(now / 520) * 0.18;
      const blink = M_WIP_MAP.pointers.size ? 0.22 : 0.35 + Math.max(0, Math.sin(now / 620)) * 0.65;
      const z = M_WIP_MAP.scale;

      ctx.strokeStyle = 'rgba(196,131,111,.12)';
      ctx.lineWidth = 1;
      for (let y = 0; y <= M_WIP_MAP.worldH; y += 72) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(M_WIP_MAP.worldW, y);
        ctx.stroke();
      }

      for (const stage of layout.stages) mDrawMobileStage(ctx, stage, z, pulse, blink);
    }

    function mDrawSummaryPill(ctx, x, y, w, label, value, meta, accent = '#c4836f') {
      mRoundRect(ctx, x, y, w, 66, 8);
      ctx.fillStyle = 'rgba(255,255,255,.92)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(196,131,111,.22)';
      ctx.stroke();
      ctx.fillStyle = accent;
      ctx.fillRect(x, y, 5, 66);
      mCanvasText(ctx, label, x + 14, y + 21, w - 24, '800 13px Inter', '#6b625d');
      mCanvasText(ctx, value, x + 14, y + 47, w - 84, '850 25px Inter', '#2d2724');
      mCanvasText(ctx, meta, x + w - 10, y + 45, 72, '800 11px Inter', '#8a817b', 'right');
    }

    function mDrawMobileStage(ctx, stage, z, pulse, blink) {
      const filteredOrders = stage.orders.filter(mWipOrderMatchesFilter);
      const dimStage = M_WIP_MAP.filter !== 'all' && filteredOrders.length === 0;
      ctx.save();
      ctx.globalAlpha = dimStage ? 0.28 : 1;
      mRoundRect(ctx, stage.x, stage.y, stage.w, stage.h, 10);
      ctx.fillStyle = '#fffaf7';
      ctx.fill();
      ctx.strokeStyle = 'rgba(196,131,111,.24)';
      ctx.lineWidth = 1.4;
      ctx.stroke();
      ctx.fillStyle = stage.color;
      ctx.fillRect(stage.x, stage.y, 7, stage.h);

      M_WIP_MAP.hitItems.push({ type: 'stage', stage: stage.stage, x: stage.x, y: stage.y, w: stage.w, h: 76 });
      mCanvasText(ctx, mWipStageLabel(stage.stage), stage.x + 18, stage.y + 29, stage.w - 112, '850 19px Inter', '#2d2724');
      mCanvasText(ctx, `${stage.orders.length}`, stage.x + stage.w - 16, stage.y + 31, 76, '850 24px Inter', stage.color, 'right');
      mCanvasText(ctx, `${stage.qty} răng · ${stage.lanes.length || 1} lane`, stage.x + 18, stage.y + 55, stage.w - 36, '800 12px Inter', '#7a716b');
      if (stage.alerts) {
        const badgeColor = stage.dangers ? M_WIP_RISK_COLOR.danger : M_WIP_RISK_COLOR.warn;
        mDrawMobileBadge(ctx, stage.x + 18, stage.y + 64, `${stage.alerts} cảnh báo`, badgeColor, 0);
      }
      if (stage.unclaimed) mDrawMobileBadge(ctx, stage.x + stage.w - 112, stage.y + 64, `${stage.unclaimed} chờ`, '#64748b', 0);

      if (z < 0.72) {
        mDrawMobileStageOverview(ctx, stage, pulse, blink);
      } else {
        for (const lane of stage.lanes) mDrawMobileLane(ctx, lane, z, pulse, blink, stage.color);
        if (!stage.lanes.length) mCanvasText(ctx, 'Không có đơn đang chờ', stage.x + 18, stage.y + 122, stage.w - 36, '800 13px Inter', '#9a918b');
      }
      ctx.restore();
    }

    function mDrawMobileBadge(ctx, x, y, text, color, blink) {
      ctx.save();
      mRoundRect(ctx, x, y, 94, 22, 11);
      ctx.fillStyle = color;
      if (blink) ctx.globalAlpha *= mWipClamp(0.35 + blink * 0.65, 0.35, 1);
      ctx.fill();
      mCanvasText(ctx, text, x + 47, y + 15, 82, '850 10px Inter', '#fff', 'center');
      ctx.restore();
    }

    function mDrawMobileStageOverview(ctx, stage, pulse, blink) {
      const x = stage.x + 16;
      const y = stage.y + 102;
      const w = stage.w - 32;
      const h = Math.max(76, stage.h - 124);
      mRoundRect(ctx, x, y, w, h, 8);
      ctx.fillStyle = 'rgba(196,131,111,.08)';
      ctx.fill();
      const orders = stage.orders.slice(0, 140);
      const cols = Math.max(7, Math.floor(w / 24));
      const r = 5.6;
      const radiusByRisk = { normal: r, warn: r + 0.6, alert: r + 1.2, danger: r + 2 };
      orders.forEach((o, i) => {
        const risk = mWipOrderRisk(o);
        const match = mWipOrderMatchesFilter(o);
        const cx = x + 16 + (i % cols) * ((w - 32) / cols);
        const cy = y + 18 + Math.floor(i / cols) * 21;
        if (cy > y + h - 10) return;
        const dotR = radiusByRisk[risk] || r;
        ctx.beginPath();
        ctx.arc(cx, cy, dotR, 0, Math.PI * 2);
        ctx.fillStyle = !match
          ? 'rgba(148,163,184,.22)'
          : (M_WIP_RISK_COLOR[risk] || stage.color);
        ctx.fill();
        if (match && risk === 'danger') {
          ctx.lineWidth = 1.2;
          ctx.strokeStyle = 'rgba(0,0,0,.35)';
          ctx.stroke();
        }
        const ktv = '_wipKtv' in o ? o._wipKtv : ktvForOrder(o);
        if (!ktv) {
          ctx.strokeStyle = '#64748b';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      });
    }

    function mDrawMobileLane(ctx, lane, z, pulse, blink, stageColor) {
      mRoundRect(ctx, lane.x, lane.y, lane.w, lane.h, 8);
      ctx.fillStyle = lane.name === M_WIP_UNCLAIMED ? 'rgba(148,163,184,.12)' : 'rgba(255,255,255,.76)';
      ctx.fill();
      ctx.strokeStyle = lane.name === M_WIP_UNCLAIMED ? 'rgba(100,116,139,.24)' : 'rgba(196,131,111,.16)';
      ctx.stroke();
      mCanvasText(ctx, lane.name, lane.x + 10, lane.y + 22, lane.w - 70, '850 12px Inter', lane.name === M_WIP_UNCLAIMED ? '#64748b' : '#2d2724');
      mCanvasText(ctx, `${lane.orders.length}`, lane.x + lane.w - 10, lane.y + 22, 36, '850 15px Inter', stageColor, 'right');

      const gap = 8;
      const cardW = (lane.w - 20 - gap * (lane.cardsPerRow - 1)) / lane.cardsPerRow;
      const cardH = 58;
      lane.orders.forEach((o, idx) => {
        const col = idx % lane.cardsPerRow;
        const row = Math.floor(idx / lane.cardsPerRow);
        const x = lane.x + 10 + col * (cardW + gap);
        const y = lane.y + 34 + row * (cardH + 6);
        mDrawMobileCard(ctx, o, x, y, cardW, cardH, z, pulse, blink, stageColor);
      });
    }

    function mDrawMobileCard(ctx, o, x, y, w, h, z, pulse, blink, stageColor) {
      const risk = mWipOrderRisk(o);
      const match = mWipOrderMatchesFilter(o);
      const riskColor = M_WIP_RISK_COLOR[risk] || stageColor;
      ctx.save();
      ctx.globalAlpha = match ? 1 : 0.18;
      mRoundRect(ctx, x, y, w, h, 7);
      ctx.fillStyle = M_WIP_RISK_BG[risk] || '#ffffff';
      ctx.fill();
      ctx.strokeStyle = risk === 'normal' ? 'rgba(196,131,111,.24)' : riskColor;
      ctx.lineWidth = 1.1;
      ctx.stroke();
      ctx.fillStyle = risk === 'normal' ? stageColor : riskColor;
      ctx.fillRect(x, y, risk === 'normal' ? 5 : 7, h);
      if (risk === 'danger') {
        ctx.save();
        ctx.globalAlpha = 0.18;
        ctx.fillStyle = riskColor;
        ctx.fillRect(x - 1, y - 1, 9, h + 2);
        ctx.restore();
      }
      M_WIP_MAP.hitItems.push({ type: 'order', id: o.ma_dh, x, y, w, h, order: o });
      mCanvasText(ctx, o.ma_dh || '---', x + 11, y + 17, w - 18, '850 11px Inter', '#2d2724');
      if (z >= 0.92) mCanvasText(ctx, o.khach_hang || '---', x + 11, y + 33, w - 18, '800 9px Inter', '#6b625d');
      if (z >= 1.22) {
        const patient = o.benh_nhan && o.benh_nhan !== 'nan' ? o.benh_nhan : '---';
        mCanvasText(ctx, `${patient} · SL ${Number(o.sl) || 0}`, x + 11, y + 49, w - 18, '800 8.5px Inter', '#8a817b');
      } else {
        mCanvasText(ctx, `SL ${Number(o.sl) || 0}`, x + w - 8, y + h - 9, 34, '850 9px Inter', '#8a817b', 'right');
      }
      ctx.restore();
    }

    function mWipFormatMinutes(min) {
      if (min == null) return '—';
      if (min <= 0) return 'quá hạn';
      if (min < 60) return `${min}p`;
      const h = min / 60;
      if (h < 24) return `${h.toFixed(h < 10 ? 1 : 0)}h`;
      return `${Math.floor(h / 24)}n`;
    }

    function mWipSetKpi(id, value, meta, state) {
      const el = document.getElementById(id);
      if (!el) return;
      const v = el.querySelector('.wip-kpi-value');
      const m = el.querySelector('.wip-kpi-meta');
      if (v) v.textContent = value;
      if (m) m.textContent = meta;
      el.classList.remove('is-ok', 'is-warn', 'is-alert', 'is-danger');
      if (state) el.classList.add('is-' + state);
    }

    function mUpdateWipKpis(kpis) {
      if (!kpis) return;
      const t = kpis.throughput || {};
      if (t.received_today != null) {
        const value = `${t.received_today}→${t.completed_today}`;
        const net = t.net_today;
        const netStr = net > 0 ? `+${net}` : `${net}`;
        const deltaStr = t.delta_pct != null
          ? ` · vs TB ${t.avg_7day} (${t.delta_pct > 0 ? '+' : ''}${t.delta_pct}%)`
          : '';
        let state = 'ok';
        if (t.delta_pct != null) {
          if (t.delta_pct <= -25) state = 'danger';
          else if (t.delta_pct <= -10) state = 'warn';
        }
        mWipSetKpi('wipKpiThroughput', value, `WIP ${netStr}${deltaStr}`, state);
      }

      const d = kpis.deadline || {};
      let dlState = null;
      if (d.count >= 8) dlState = 'danger';
      else if (d.count >= 4) dlState = 'alert';
      else if (d.count >= 1) dlState = 'warn';
      const dlMeta = d.count
        ? (d.urgent_count
            ? `≤4h · ${d.urgent_count} đơn <1h`
            : `≤4h · sát nhất ${mWipFormatMinutes(d.most_urgent_minutes)}`)
        : 'Không có đơn nào sát hạn';
      mWipSetKpi('wipKpiDeadline', `${d.count || 0} đơn`, dlMeta, dlState);

      const b = kpis.bottleneck;
      if (b && b.stage) {
        const ratio = b.avg_ratio != null ? `${b.avg_ratio}× TB` : '—';
        const value = mWipStageLabel(b.stage);
        const meta = `${b.over_p75_count}/${b.stage_count} vượt P75 · tb ${ratio}`;
        const ratioVal = b.avg_ratio || 0;
        let bnState = null;
        if (ratioVal >= 3) bnState = 'danger';
        else if (ratioVal >= 2) bnState = 'alert';
        else if (ratioVal >= 1) bnState = 'warn';
        mWipSetKpi('wipKpiBottleneck', value, meta, bnState);
      } else {
        mWipSetKpi('wipKpiBottleneck', '—', 'Chưa đủ dữ liệu', null);
      }

      const bal = kpis.balance || {};
      if (bal.top_ktv) {
        const med = Math.max(1, bal.median_ktv_count || 1);
        const heavy = bal.top_ktv_count >= 2 * med;
        const dropped = (bal.unclaimed_pct || 0) >= 15;
        let state = null;
        if (heavy && dropped) state = 'danger';
        else if (heavy || dropped) state = 'alert';
        const value = `${bal.top_ktv}: ${bal.top_ktv_count}`;
        const meta = `${bal.unclaimed_count} chưa nhận (${bal.unclaimed_pct || 0}%) · TB ${bal.median_ktv_count}`;
        mWipSetKpi('wipKpiBalance', value, meta, state);
      } else {
        const meta = `${bal.unclaimed_count || 0} chưa nhận`;
        mWipSetKpi('wipKpiBalance', '—', meta, null);
      }
    }

    function groupByCompletionTime(orders) {
      const grouped = new Map();
      orders.forEach(o => {
        const cat = getCompletionTimeGroup(o.yc_ht);
        const key = o.yc_ht || 'no-deadline';
        if (!grouped.has(key)) {
          grouped.set(key, { orders: [], cat });
        }
        grouped.get(key).orders.push(o);
      });
      return grouped;
    }

    function parseDeadline(str) {
      if (!str) return null;
      const parts = String(str).trim().split(/\s+/);
      const d = parts[0];
      const t = parts[1] || '00:00:00';
      if (d.includes('/')) {
        const [dd, mm, yyyy] = d.split('/');
        return new Date(`${yyyy}-${mm.padStart(2,'0')}-${dd.padStart(2,'0')}T${t}`);
      }
      return new Date(str);
    }

    function sortOrdersByDeadline(orders) {
      return [...orders].sort((a, b) => {
        const dateA = parseDeadline(a.yc_ht) || new Date('9999-12-31');
        const dateB = parseDeadline(b.yc_ht) || new Date('9999-12-31');
        if (dateA - dateB !== 0) return dateA - dateB;
        return (a.ma_dh || '').localeCompare(b.ma_dh || '');
      });
    }

    function sortGroupsByDeadline(groups) {
      return Array.from(groups.entries()).sort(([keyA], [keyB]) => {
        const isNoA = keyA === 'no-deadline';
        const isNoB = keyB === 'no-deadline';
        if (isNoA && !isNoB) return 1;
        if (!isNoA && isNoB) return -1;
        if (isNoA && isNoB) return 0;
        const dateA = parseDeadline(keyA);
        const dateB = parseDeadline(keyB);
        return (dateA || 0) - (dateB || 0);
      });
    }

    function getLoaiLenhColor(lk) {
      const colors = {
        'Làm mới': { bg: '#4ade80', text: '#fff' },      // xanh lá
        'Sửa': { bg: '#f97316', text: '#fff' },          // cam
        'Làm lại': { bg: '#eab308', text: '#000' },      // vàng
        'Bảo hành': { bg: '#a855f7', text: '#fff' },     // tím
        'Làm thêm': { bg: '#0ea5e9', text: '#fff' },     // xanh dương
        'Làm tiếp': { bg: '#0ea5e9', text: '#fff' },     // xanh dương
      };
      return colors[lk] || { bg: '#94a3b8', text: '#fff' };
    }

    function renderCard(o) {
      const stageColor = STAGE_COLORS[o.current_stage] || '#94a3b8';
      const short = STAGE_SHORT[o.current_stage] || o.current_stage;
      const cat = getCompletionTimeGroup(o.yc_ht);
      const urgentBadge = o.urgent ? '<span class="badge badge-urgent">⚡ GẤP</span>' : '';
      const delayBadge = o.delay_report ? '<span class="badge badge-urgent">TRỄ</span>' : '';
      const phT = phType(o.phuc_hinh);
      const phBadge = `<span class="ph-badge ph-${phT}">${phShort(o.phuc_hinh)}</span>`;
      const patient = o.benh_nhan && o.benh_nhan !== 'nan' ? o.benh_nhan : '—';
      const shownQty = displayQty(o);

      // Loai lenh chip
      const lkColor = getLoaiLenhColor(o.loai_lenh);
      const lkChip = o.loai_lenh ? `<span style="position: absolute; bottom: 22px; right: 8px; font-size: 9px; padding: 2px 6px; border-radius: 3px; background: ${lkColor.bg}; color: ${lkColor.text}; font-weight: 500; max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${o.loai_lenh}</span>` : '';
      // Get current KTV - find last stage with KTV (for completed orders) or current stage
      let currentKtv = '';
      if (o.current_stage === 'HOÀN TẤT') {
        // Order completed - get last KTV
        for (let i = o.stagesData.length - 1; i >= 0; i--) {
          if (!o.stagesData[i].sk && o.stagesData[i].k) {
            currentKtv = o.stagesData[i].k;
            break;
          }
        }
      } else {
        // Order in progress - get current stage KTV
        const currentStage = o.stagesData.find(s => !s.sk && s.n === o.current_stage);
        currentKtv = currentStage && currentStage.k ? currentStage.k : '';
      }

      const pipsHtml = o.stagesData.map(s => {
        if (s.sk) return `<div class="stage-pip skip"><div class="pip-fill"></div></div>`;
        const cls = s.x ? 'done' : (s.n === o.current_stage ? 'current' : '');
        return `<div class="stage-pip ${cls}"><div class="pip-fill"></div></div>`;
      }).join('');

      return `
        <div class="card ${cat}${o.delay_report ? ' delay-reported' : ''}" style="cursor: pointer; position: relative; border-left-color: ${roomColor(o.routed_to)};" data-ma-dh="${o.ma_dh}">
          <div class="card-row1">
            <div class="order-code">${o.ma_dh}</div>
            <div class="card-customer" style="flex: 1; text-align: center; margin: 0;">${o.khach_hang}</div>
            <div class="card-badges">${phBadge}${urgentBadge}${delayBadge}</div>
          </div>
          <div class="card-row2">
            <div class="card-patient">${patient}</div>
            <div class="card-sl">${shownQty.label}: ${shownQty.qty}</div>
          </div>
          <div class="card-prosthesis">${displayHtml(o.phuc_hinh)}</div>
          ${currentKtv ? `<div class="card-stage-label" style="font-size: 11px; color: var(--text-primary); margin-top: 4px;">👤 ${currentKtv}</div>` : ''}
          ${pipsHtml ? `<div class="stage-pips">${pipsHtml}</div>` : ''}
          ${(() => {
            const noteKtvs = parseNoteKtvs(o.ghi_chu, o.loai_lenh);
            if (!noteKtvs.length) return '';
            const byStage = {};
            for (const k of noteKtvs) { (byStage[k.stage] = byStage[k.stage] || []).push(k.name); }
            const cells = o.stagesData.map(s => {
              const names = byStage[s.n] || [];
              return `<div style="flex:1; text-align:center; font-size:11px; line-height:1.3; color:#000; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${names.join(', ')}</div>`;
            }).join('');
            return `<div style="display:flex; gap:4px; margin-top:4px; margin-bottom:-7px;">${cells}</div>`;
          })()}
          ${lkChip}
        </div>
      `;
    }

    function renderCards() {
      const list = getFiltered();
      renderFilterSummary(getChipFiltered());
      const container = document.getElementById('cardList');

      const fingerprint = computeOrdersFingerprint(list) + '|' + filterPh + '|' + (filterSearch || '');
      if (fingerprint === lastCardsFingerprint) return;
      lastCardsFingerprint = fingerprint;

      if (list.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">○</div><p>Không có đơn nào</p></div>';
        return;
      }

      const sortedList = sortOrdersByDeadline(list);
      const groups = groupByCompletionTime(sortedList);
      const sortedGroups = sortGroupsByDeadline(groups);
      let html = '';

      sortedGroups.forEach(([key, group]) => {
        const { orders, cat } = group;
        orders.sort((a, b) => {
          const dateA = parseDeadline(a.yc_ht) || new Date('9999-12-31');
          const dateB = parseDeadline(b.yc_ht) || new Date('9999-12-31');
          if (dateA - dateB !== 0) return dateA - dateB;
          return (a.ma_dh || '').localeCompare(b.ma_dh || '');
        });

        const totalSL = orders.reduce((s, o) => s + filterQty(o, filterPh), 0);
        const time = formatTime(orders[0].yc_ht);
        const dateRaw = (orders[0].yc_ht || '').split(' ')[0];
        const dateParts = dateRaw ? dateRaw.split('-') : [];
        const dateLabel = dateParts.length === 3 ? `${dateParts[2]}/${dateParts[1]}` : '';
        const giaoLabels = [...new Set(orders
          .map(o => parseYcHtDay(o.yc_ht)?.label)
          .filter(Boolean))];
        const giaoLabel = giaoLabels.length === 1 ? giaoLabels[0] : (giaoLabels.length > 1 ? `${giaoLabels[0]}+` : '');

        html += `
          <div class="time-group">
            <div class="time-group-header ${cat}">
              <div class="tg-time">${
                cat === 'morning' ? 'SÁNG' :
                cat === 'noon' ? 'TRƯA' :
                cat === 'afternoon' ? 'CHIỀU' :
                cat === 'evening' ? 'TỐI' :
                'KHÁC'
              }${time !== '—' ? ` · ${time}` : ''}${dateLabel ? ` · ${dateLabel}` : ''}</div>
              <div class="tg-meta">
                ${giaoLabel ? `<div class="tg-date">Giao ${giaoLabel}</div>` : ''}
                <div class="tg-count">${orders.length} đơn · ${totalSL} răng</div>
              </div>
            </div>
            <div class="tg-cards">
              ${orders.map(o => renderCard(o)).join('')}
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    async function routeOrder(maDh, targetRoom) {
      const r = await fetch('/api/orders/route', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ma_dh: maDh, target_room: targetRoom }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || !data.ok) {
        showToast(data.error || 'Không chuyển được đơn', r.status === 409 ? 'warn' : 'error');
        return false;
      }
      showToast(`Đã chuyển ${maDh} sang ${roomLabel[targetRoom]}`);
      await loadUserPendingOrders();
      return true;
    }

    async function handleScannedTransfer(code) {
      const target = getTransferTargetRoom();
      if (!target) return;
      try {
        const r = await fetch(`/api/orders/by-barcode/${encodeURIComponent(code)}`);
        const data = await r.json().catch(() => ({}));
        if (!r.ok || !data.ok) {
          showToast(data.error || 'Không tìm thấy đơn', 'warn');
          return;
        }
        const order = data.order;
        if (order.has_confirmed) {
          const stage = order.confirmed_stage ? ` ${order.confirmed_stage}` : '';
          showToast(`Đơn ${order.ma_dh} đã xác nhận${stage}, không thể chuyển`, 'warn');
          return;
        }
        const ph = order.phuc_hinh ? ` (${phShort(order.phuc_hinh)})` : '';
        if (!confirm(`Chuyển đơn ${order.ma_dh}${ph} sang phòng ${roomLabel[target]}?`)) return;
        await routeOrder(order.ma_dh, target);
      } catch {
        showToast('Lỗi kết nối khi tra barcode', 'warn');
      }
    }

    async function openTransferScanner() {
      const target = getTransferTargetRoom();
      if (!target) return;
      const modal = document.getElementById('transferScannerModal');
      const status = document.getElementById('transferScannerStatus');
      const title = document.getElementById('transferScannerTitle');
      if (!window.ZXing) {
        showToast('Không tải được thư viện quét barcode', 'warn');
        return;
      }
      if (title) title.textContent = `Quét barcode để chuyển qua ${roomLabel[target]}`;
      modal.classList.add('open');
      transferScannerActive = true;
      status.textContent = 'Đang khởi động camera...';

      try {
        transferReader = new ZXing.BrowserMultiFormatReader();
        await transferReader.decodeFromConstraints(
          { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } },
          document.getElementById('transferScannerVideo'),
          async (result, err) => {
            if (!transferScannerActive) return;
            if (result) {
              const value = result.getText().trim();
              closeTransferScanner();
              await handleScannedTransfer(value);
              return;
            }
            if (err && !(err instanceof ZXing.NotFoundException)) console.warn('ZXing:', err);
          }
        );
        if (transferScannerActive) status.textContent = 'Đang tìm barcode...';
      } catch (err) {
        if (transferScannerActive) {
          status.textContent = err.name === 'NotAllowedError'
            ? 'Cần cấp quyền camera'
            : ('Không mở được camera: ' + (err.message || err));
        }
      }
    }

    function closeTransferScanner() {
      transferScannerActive = false;
      if (transferReader) { try { transferReader.reset(); } catch (_) {} transferReader = null; }
      document.getElementById('transferScannerModal').classList.remove('open');
    }

    function handleTransferScannerBackdrop(e) {
      if (e.target === document.getElementById('transferScannerModal')) closeTransferScanner();
    }

            <span>Nhận: ${o.nhan || '—'}</span>
            <span>Hẹn: ${o.yc_giao || '—'}</span>
          </div>
        </div>
      `;

      document.getElementById('modalContent').innerHTML = modalContent;
      document.getElementById('modalOverlay').classList.add('open');
    }

    function closeOrderDetail() {
      document.getElementById('modalOverlay').classList.remove('open');
    }

    let _dayModalOrders = [];

    function openDayModal(dayKey, label) {
      _dayModalOrders = getChipFiltered()
        .filter(o => parseYcHtDay(o.yc_ht)?.key === dayKey)
        .filter(o => o.current_stage !== 'HOÀN TẤT')
        .sort((a, b) => {
          const ta = (a.yc_ht || '').split(' ')[1] || '99:99';
          const tb = (b.yc_ht || '').split(' ')[1] || '99:99';
          return ta.localeCompare(tb);
        });

      function renderDayRow(o, i) {
        const timeStr = (o.yc_ht || '').split(' ')[1]?.slice(0, 5) || '';
        const qty = filterQty(o, filterPh);
        const phT = phType(o.phuc_hinh);
        const phBadge = `<span class="ph-badge ph-${phT}">${phShort(o.phuc_hinh)}</span>`;
        const pipsHtml = (o.stagesData || []).map(s => {
          if (s.sk) return `<div class="stage-pip skip"><div class="pip-fill"></div></div>`;
          const cls = s.x ? 'done' : (s.n === o.current_stage ? 'current' : '');
          return `<div class="stage-pip ${cls}"><div class="pip-fill"></div></div>`;
        }).join('');
        return `
          <div class="day-order-row" onclick="showDayOrderDetail(${i})">
            <div class="day-order-main">
              <div class="day-order-head">
                <span class="day-order-code">${o.ma_dh}</span>
                ${phBadge}
              </div>
              <div style="font-size:11px;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${o.benh_nhan || '—'} · ${o.khach_hang || '—'}</div>
              ${pipsHtml ? `<div class="stage-pips day-order-pips">${pipsHtml}</div>` : ''}
            </div>
            <div class="day-order-side">
              <div class="day-order-stage">${o.current_stage}</div>
              <div style="font-size:10px;color:var(--text-primary);margin-top:2px;">${qty} răng${timeStr ? ' · ' + timeStr : ''}</div>
            </div>
          </div>`;
      }

      let rows;
      if (!_dayModalOrders.length) {
        rows = `<div style="padding:28px 0;text-align:center;color:var(--text-muted);font-size:13px;">✅ Tất cả đơn ngày này đã hoàn thành</div>`;
      } else {
        // Nhóm theo HH:MM, chèn separator đỏ gạch giữa các nhóm giờ khác nhau
        const groups = [];
        let lastTime = null;
        _dayModalOrders.forEach((o, i) => {
          const t = (o.yc_ht || '').split(' ')[1]?.slice(0, 5) || '';
          if (t !== lastTime) { groups.push([]); lastTime = t; }
          groups[groups.length - 1].push({ o, i });
        });
        rows = groups.map((grp, gi) =>
          (gi > 0 ? '<div class="day-group-sep"></div>' : '') +
          grp.map(({ o, i }) => renderDayRow(o, i)).join('')
        ).join('');
      }

      document.getElementById('dayModalContent').innerHTML = `
        <div style="background:var(--bg-card);padding:16px;max-height:75vh;overflow-y:auto;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
            <div>
              <div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;">Chưa hoàn thành · ${label}</div>
              <div style="font-size:15px;font-weight:700;color:var(--text-primary);margin-top:3px;">${_dayModalOrders.length} đơn đang làm</div>
            </div>
            <button type="button" onclick="closeDayModal()" style="cursor:pointer;font-size:13px;color:var(--text-primary);padding:8px 12px;border:1px solid var(--border-card);border-radius:6px;background:#fff;font-weight:700;min-height:36px;">Đóng</button>
          </div>
          ${rows}
        </div>
      `;
      document.getElementById('dayModalOverlay').classList.add('open');
    }

    function closeDayModal() {
      document.getElementById('dayModalOverlay').classList.remove('open');
    }

    function showDayOrderDetail(idx) {
      const o = _dayModalOrders[idx];
      if (o) showOrderDetail(o);
    }

    async function initAdminUI() {
      try {
        const r = await fetch('/user');
        if (!r.ok) return;
        const u = await r.json();
        currentUser = u;
        if (hasPerm('admin.users.manage')) {
          const adminBtn = document.getElementById('m-admin-btn');
          if (adminBtn) adminBtn.classList.add('admin-visible');
        }
        if (hasPerm('admin.upload_excel')) {
          const upBtn = document.getElementById('m-upload-btn');
          if (upBtn) upBtn.classList.add('admin-visible');
        }
        if (hasPerm('munger.view')) {
          const mungerBtn = document.getElementById('m-munger-btn');
          if (mungerBtn) mungerBtn.classList.add('admin-visible');
        }
        if (canViewWipPanel()) {
          const wipBtn = document.getElementById('m-wip-btn');
          if (wipBtn) wipBtn.classList.add('admin-visible');
        }
        if (hasPerm('delay_reports.review')) {
          const delayReportsBtn = document.getElementById('m-delayreports-btn');
          if (delayReportsBtn) delayReportsBtn.classList.add('admin-visible');
        }
        if (hasPerm('delay_reports.submit')) {
          const delayBtn = document.getElementById('m-baotre-btn');
          if (delayBtn) delayBtn.classList.add('delay-visible');
        }
        if (hasPerm('error_reports.submit')) {
          const errorBtn = document.getElementById('m-baoloi-btn');
          if (errorBtn) errorBtn.classList.add('delay-visible');
        }
        updateFeedbackAlert();
      } catch {}
    }

  </script>

  <!-- Modal chi tiết đơn -->
  <div id="modalOverlay" style="display: none;">
    <div id="modalContent"></div>
  </div>

  <!-- Modal danh sách đơn chưa hoàn thành theo ngày -->
  <div id="dayModalOverlay" onclick="if(event.target===this)closeDayModal()">
    <div id="dayModalContent"></div>
  </div>
</body>
</html>
